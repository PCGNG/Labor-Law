<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labor Law Reviewer by PCGNG | 3-Pane Syllabus View</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090e17;
      --bg-sidebar: #0d1420;
      --bg-middle: #101826;
      --bg-right: #131d2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
      --emerald-accent: #10b981;
      --sky-accent: #38bdf8;
      --rose-accent: #fb7185;
      
      --info-bg: #eceae3;
      --info-text: #1e293b;
      --card-color-1: #e2ede5;
      --card-color-2: #fde8e7;
      --card-color-3: #f4ecdf;
      --card-color-4: #daf0e4;
      --card-color-5: #e0f2fe;
      --card-color-6: #fdf5d6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header.app-bar {
      height: 56px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand-block { display: flex; align-items: center; gap: 12px; }
    .brand-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .badge-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
    }

    .badge-pill-interactive {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      user-select: none;
    }

    .badge-outline {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-pdf-btn {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-accent);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .badge-pdf-btn:hover {
      background: var(--gold-accent);
      color: #000;
    }

    .badge-back-btn {
      background: rgba(56, 189, 248, 0.15);
      color: var(--sky-accent);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .badge-back-btn:hover {
      background: var(--sky-accent);
      color: #000;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .btn-secondary:hover { background: #334155; color: #fff; }
    .btn-primary { background: var(--gold-accent); color: #000; font-weight: 700; }
    .btn-primary:hover { background: #d97706; }

    /* Jump to Bookmark button in Top Bar */
    .btn-jump-bookmark {
      background: rgba(251, 113, 133, 0.16);
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.45);
    }
    .btn-jump-bookmark:hover {
      background: #f43f5e;
      color: #fff;
    }

    .btn-read-toggle {
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-read-toggle:hover { background: #28374d; color: #fff; }
    .btn-read-toggle.is-read {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.5);
    }

    /* Star & Bookmark Header Toggle Buttons */
    .btn-star-toggle {
      padding: 3px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-star-toggle:hover { background: #28374d; color: #fff; }
    .btn-star-toggle.is-starred {
      background: rgba(245, 158, 11, 0.22);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.55);
    }

    .btn-bookmark-toggle {
      padding: 3px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-bookmark-toggle:hover { background: #28374d; color: #fff; }
    .btn-bookmark-toggle.is-bookmarked {
      background: rgba(244, 63, 94, 0.22);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.55);
    }

    .btn-postit-toggle {
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      background: rgba(254, 240, 138, 0.12);
      color: #fef08a;
      border: 1px solid rgba(254, 240, 138, 0.35);
    }
    .btn-postit-toggle:hover {
      background: rgba(254, 240, 138, 0.25);
      color: #fff;
    }
    .btn-postit-toggle.has-note {
      background: #fef08a;
      color: #1e293b;
      border-color: #eab308;
    }

    .three-pane-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      width: 100vw;
    }

    .pane-header-strip {
      height: 42px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(13, 20, 32, 0.85);
      flex-shrink: 0;
    }

    /* PANE 1: LEFT SYLLABUS TREE */
    .pane-left-tree {
      width: 420px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tree-scroll-area { flex: 1; overflow-y: auto; padding: 14px 12px; }

    .topic-card {
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.015);
      border-radius: 8px;
      overflow: hidden;
    }

    .topic-card.bookmarked-topic {
      border-color: rgba(244, 63, 94, 0.55);
      box-shadow: 0 0 0 1px rgba(244, 63, 94, 0.25);
    }

    .topic-title {
      padding: 10px 12px;
      background: rgba(30, 41, 59, 0.6);
      font-size: 0.84rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .topic-title:hover {
      background: rgba(47, 63, 89, 0.8);
      color: #fff;
    }

    .topic-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topic-title-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .topic-arrow {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .topic-card.collapsed .topic-content { display: none; }
    .topic-card.collapsed .topic-arrow { transform: rotate(-90deg); }

    .subtopic-item {
      padding: 9px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .subtopic-item:hover, .subtopic-item.active-subtopic {
      color: var(--sky-accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .subtopic-item.bookmarked-row {
      background: rgba(244, 63, 94, 0.12);
      border-left: 3px solid #f43f5e;
    }

    /* Inline Sidebar Action Icons (Star & Bookmark) */
    .sidebar-icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.86rem;
      line-height: 1;
      padding: 2px 3px;
      border-radius: 4px;
      color: #475569;
      transition: transform 0.12s ease, color 0.15s ease, opacity 0.15s ease;
      opacity: 0.55;
    }
    .sidebar-icon-btn:hover {
      opacity: 1;
      transform: scale(1.15);
      color: #cbd5e1;
    }
    .sidebar-icon-btn.star-active {
      opacity: 1;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.45);
    }
    .sidebar-icon-btn.bookmark-active {
      opacity: 1;
      color: #f43f5e;
      filter: drop-shadow(0 0 4px rgba(244, 63, 94, 0.5));
    }

    .read-check-indicator {
      color: #10b981;
      font-weight: 800;
      margin-left: 3px;
      font-size: 0.78rem;
    }

    .note-pin-indicator {
      margin-left: 3px;
      font-size: 0.74rem;
    }

    .case-sub-list {
      padding: 6px 8px 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 2px solid #1e293b;
      margin: 4px 0 6px 14px;
    }

    .case-node {
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: normal;
      word-break: break-word;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .case-node:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .case-node.active-case {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-accent);
      font-weight: 700;
      border-left: 3px solid var(--gold-accent);
    }
    .case-node.bookmarked-row {
      box-shadow: inset 0 0 0 1px rgba(244, 63, 94, 0.5);
      background: rgba(244, 63, 94, 0.1);
    }

    /* PANE 2: MIDDLE */
    .pane-middle-overview {
      flex: 1.15;
      background: var(--bg-middle);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .middle-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
    }

    .middle-pdf-frame-container {
      flex: 1;
      display: none;
      flex-direction: column;
      background: #0d1420;
    }

    .pdf-viewer-bar {
      height: 40px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .middle-pdf-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .infographic-sheet {
      width: 100%;
      background-color: var(--info-bg);
      color: var(--info-text);
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }

    .info-header {
      border-bottom: 2px solid #ded9cb;
      padding-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.25;
      color: #111827;
      text-transform: uppercase;
    }

    .overview-card-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .dynamic-topic-card {
      border-radius: 8px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      width: 100%;
    }

    .dynamic-topic-card pre {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1e293b;
      margin: 0;
    }

    /* PANE 3: RIGHT DIGEST */
    .pane-right-digest {
      flex: 1.35;
      background: var(--bg-right);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .digest-scroll-area { flex: 1; overflow-y: auto; padding: 28px 36px; }
    .digest-meta-tag {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .digest-case-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
      margin-bottom: 8px;
    }

    .digest-citation {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    /* POST-IT STICKY NOTE CARD */
    .postit-note-wrapper {
      background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
      color: #1e293b;
      border-radius: 4px 4px 16px 4px;
      padding: 14px 18px 16px 18px;
      margin-bottom: 26px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), 0 2px 4px rgba(0, 0, 0, 0.2);
      border-top: 8px solid rgba(202, 138, 4, 0.35);
      position: relative;
      transition: all 0.2s ease;
    }

    .postit-note-wrapper.hidden {
      display: none;
    }

    .postit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      border-bottom: 1px dashed rgba(133, 77, 14, 0.3);
      padding-bottom: 6px;
    }

    .postit-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #854d0e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .postit-status {
      font-size: 0.7rem;
      font-weight: 700;
      color: #a16207;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .postit-clear-btn {
      background: transparent;
      border: 1px solid rgba(133, 77, 14, 0.35);
      color: #854d0e;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
    }
    .postit-clear-btn:hover {
      background: rgba(133, 77, 14, 0.12);
    }

    .postit-textarea {
      width: 100%;
      min-height: 85px;
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.98rem;
      font-weight: 500;
      line-height: 1.6;
      color: #1e293b;
    }

    .postit-textarea::placeholder {
      color: rgba(113, 63, 18, 0.55);
      font-style: italic;
    }

    .digest-section { margin-bottom: 28px; }
    
    .section-label {
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label.facts-label { color: #fbbf24; }
    .section-label.issue-label { color: #38bdf8; }
    .section-label.held-label { color: #34d399; }
    .section-label.ratio-label { color: #f472b6; }
    .section-label.fallo-label { color: #f87171; }

    .digest-text-content {
      font-size: 1.12rem;
      line-height: 1.8;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 18px 22px;
      border-radius: 8px;
      white-space: pre-wrap;
      text-align: justify;
      text-justify: inter-word;
    }

    .verbatim-box {
      font-style: italic;
      border-left: 4px solid #34d399;
      background: rgba(5, 150, 105, 0.08);
      padding: 18px 22px;
      border-radius: 0 8px 8px 0;
      color: #e2e8f0;
      font-size: 1.12rem;
      line-height: 1.8;
      white-space: pre-wrap;
      text-align: justify;
      text-justify: inter-word;
    }

    .fallo-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 18px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.02rem;
      line-height: 1.7;
      color: #fca5a5;
      white-space: pre-wrap;
      text-align: justify;
      text-justify: inter-word;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #263346; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="app-bar">
    <div class="brand-block">
      <span class="brand-title">⚖ Labor Law Reviewer by PCGNG</span>
      <span class="badge-pill">3-Pane Syllabus View</span>
    </div>
    <div class="nav-actions">
      <button id="jumpBookmarkBtn" class="btn btn-jump-bookmark" style="display: none;" onclick="jumpToBookmark()">🔖 Jump to Bookmark</button>
      <button class="btn btn-secondary" onclick="exportProgressBackup()" title="Download your stars, bookmarks, sticky notes, and read progress">⬇ Export Backup</button>
      <button class="btn btn-secondary" onclick="document.getElementById('importBackupInput').click()" title="Load a previously exported backup JSON file">⬆ Import Backup</button>
      <input type="file" id="importBackupInput" accept=".json" style="display: none;" onchange="importProgressBackup(event)">
      <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
    </div>
  </header>

  <!-- 3-PANE WORKSPACE -->
  <main class="three-pane-container">
    <aside class="pane-left-tree">
      <div class="pane-header-strip">
        <span>📁 Syllabus Hierarchy</span>
        <span id="caseCountBadge" class="badge-pill">Loading...</span>
      </div>
      <div class="tree-scroll-area" id="syllabusTreeContainer"></div>
    </aside>

    <!-- MIDDLE PANE WITH DUAL MODE: OVERVIEW & PDF -->
    <section class="pane-middle-overview">
      <div class="pane-header-strip">
        <span>● Topic & Sub-Topic Overview</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span id="middleTag" style="color: var(--gold-accent); margin-right: 4px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Doctrine Focus</span>
          <button id="overviewBookmarkBtn" class="btn-bookmark-toggle" onclick="toggleCurrentSubtopicBookmark()" title="Bookmark this subtopic overview">🔖 Bookmark</button>
          <button id="overviewReadBtn" class="btn-read-toggle" onclick="toggleOverviewRead()">Mark Read</button>
        </div>
      </div>
      
      <!-- MODE 1: Overview Cards (Default) -->
      <div class="middle-scroll-area" id="overviewScrollArea">
        <div class="infographic-sheet" id="overviewCanvas"></div>
      </div>

      <!-- MODE 2: PDF Viewer Frame -->
      <div class="middle-pdf-frame-container" id="pdfFrameContainer">
        <div class="pdf-viewer-bar">
          <span id="pdfFileNameLabel" style="font-size: 0.75rem; font-weight: 700; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
          <div style="display: flex; gap: 8px; align-items: center;">
            <a id="pdfOpenNewTabBtn" href="#" target="_blank" class="btn btn-secondary" style="padding: 3px 8px; font-size: 0.68rem; text-decoration: none;">Open ↗</a>
            <button class="badge-pill-interactive badge-back-btn" onclick="showOverviewView()">✕ Back to Outline</button>
          </div>
        </div>
        <iframe id="pdfIframe" class="middle-pdf-iframe" src=""></iframe>
      </div>
    </section>

    <!-- RIGHT PANE (CASE DIGEST WITH STAR, BOOKMARK, STICKY NOTE, NEXT CASE & READ) -->
    <section class="pane-right-digest">
      <div class="pane-header-strip">
        <span>⚖ Case Digest</span>
        <div style="display: flex; gap: 5px; align-items: center;">
          <button id="caseStarBtn" class="btn-star-toggle" onclick="toggleCurrentCaseStar()" title="Mark case as important">☆ Star</button>
          <button id="caseBookmarkBtn" class="btn-bookmark-toggle" onclick="toggleCurrentCaseBookmark()" title="Bookmark this case as where you left off">🔖 Bookmark</button>
          <button id="postitToggleBtn" class="btn-postit-toggle" onclick="togglePostitVisibility()">📌 Note</button>
          <button id="nextCaseBtn" class="btn btn-secondary" style="padding: 3px 8px; font-size: 0.72rem;" onclick="nextCase()">Next →</button>
          <button id="caseReadBtn" class="btn-read-toggle" onclick="toggleCaseRead()">Mark Read</button>
          <button class="btn btn-secondary" style="padding: 3px 8px; font-size: 0.72rem;" onclick="copyRatio()">Copy Ratio</button>
        </div>
      </div>
      <div class="digest-scroll-area" id="digestCanvas"></div>
    </section>
  </main>

  <script>
    let syllabusData = [];
    let selectedIndex = 0;
    const fileCache = {};
    const topicCollapseState = {};
    let isPostitForceOpen = false;

    let readRecords = {
      overviews: {},
      cases: {}
    };

    let stickyNotes = {};
    let starredCases = {};
    // activeBookmark format: { type: 'topic' | 'subtopic' | 'case', key: string, index: number, label: string } | null
    let activeBookmark = null;

    try {
      const storedRead = localStorage.getItem('labor_reviewer_read_status');
      if (storedRead) readRecords = JSON.parse(storedRead);
    } catch (e) { console.error(e); }

    try {
      const storedNotes = localStorage.getItem('labor_reviewer_sticky_notes');
      if (storedNotes) stickyNotes = JSON.parse(storedNotes);
    } catch (e) { console.error(e); }

    try {
      const storedStars = localStorage.getItem('labor_reviewer_starred_cases');
      if (storedStars) starredCases = JSON.parse(storedStars);
    } catch (e) { console.error(e); }

    try {
      const storedBookmark = localStorage.getItem('labor_reviewer_active_bookmark');
      if (storedBookmark) activeBookmark = JSON.parse(storedBookmark);
    } catch (e) { console.error(e); }

    function saveReadRecords() {
      try { localStorage.setItem('labor_reviewer_read_status', JSON.stringify(readRecords)); } catch (e) {}
    }

    function saveStickyNotes() {
      try { localStorage.setItem('labor_reviewer_sticky_notes', JSON.stringify(stickyNotes)); } catch (e) {}
    }

    function saveStarredCases() {
      try { localStorage.setItem('labor_reviewer_starred_cases', JSON.stringify(starredCases)); } catch (e) {}
    }

    function saveActiveBookmark() {
      try { localStorage.setItem('labor_reviewer_active_bookmark', JSON.stringify(activeBookmark)); } catch (e) {}
    }

    /* EXPORT & IMPORT BACKUP FUNCTIONS */
    function exportProgressBackup() {
      const payload = {
        app: "Labor Law Reviewer by PCGNG",
        exportedAt: new Date().toISOString(),
        readRecords: readRecords,
        stickyNotes: stickyNotes,
        starredCases: starredCases,
        activeBookmark: activeBookmark
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `LaborLaw_Notes_Backup_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importProgressBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.readRecords) {
            readRecords.overviews = { ...readRecords.overviews, ...(imported.readRecords.overviews || {}) };
            readRecords.cases = { ...readRecords.cases, ...(imported.readRecords.cases || {}) };
            saveReadRecords();
          }
          if (imported.stickyNotes) {
            stickyNotes = { ...stickyNotes, ...imported.stickyNotes };
            saveStickyNotes();
          }
          if (imported.starredCases) {
            starredCases = { ...starredCases, ...imported.starredCases };
            saveStarredCases();
          }
          if (imported.activeBookmark !== undefined) {
            activeBookmark = imported.activeBookmark;
            saveActiveBookmark();
          }
          renderApp();
          alert("Backup imported successfully! Your stars, bookmarks, sticky notes, and read checkmarks are now synced.");
        } catch (err) {
          alert("Invalid backup file. Please select a valid LaborLaw_Notes_Backup JSON file.");
        }
        event.target.value = "";
      };
      reader.readAsText(file);
    }

    const cardPalette = [
      'var(--card-color-1)',
      'var(--card-color-2)',
      'var(--card-color-3)',
      'var(--card-color-4)',
      'var(--card-color-5)',
      'var(--card-color-6)'
    ];

    function isActualCaseEntry(item) {
      if (!item || !item.digestFile) return false;
      if (item.digestFile.includes('General Provisions and Statutory Principles.txt')) return false;
      if (item.id && item.id.startsWith('slu-subtopic-')) return false;
      if (item.id === 'concept-security-of-tenure') return false;
      return true;
    }

    fetch('cases.json?t=' + Date.now())
      .then(res => {
        if (!res.ok) throw new Error("Could not find cases.json in repository.");
        return res.json();
      })
      .then(data => {
        syllabusData = data;
        
        if (syllabusData.length > 0) {
          const activeTopic = syllabusData[0].topic;
          syllabusData.forEach(item => {
            if (item.topic !== activeTopic && topicCollapseState[item.topic] === undefined) {
              topicCollapseState[item.topic] = true;
            } else if (topicCollapseState[item.topic] === undefined) {
              topicCollapseState[item.topic] = false;
            }
          });
        }
        
        renderApp();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('overviewCanvas').innerHTML = `
          <div style="padding: 20px; text-align: center; color: #ef4444;">
            <h3>Failed to load cases.json</h3>
            <p style="font-size: 0.85rem; margin-top: 6px; color: #94a3b8;">
              Please make sure <code>cases.json</code> is committed in your GitHub repository.
            </p>
          </div>
        `;
      });

    function renderApp() {
      renderLeftTree();
      renderMiddleOverview();
      renderRightDigest();
      updateActionButtons();
    }

    function toggleTopicCollapse(topicName) {
      topicCollapseState[topicName] = !topicCollapseState[topicName];
      renderLeftTree();
    }

    /* STAR & BOOKMARK HANDLERS */
    function toggleCaseStarById(caseId, event) {
      if (event) event.stopPropagation();
      starredCases[caseId] = !starredCases[caseId];
      if (!starredCases[caseId]) delete starredCases[caseId];
      saveStarredCases();
      renderLeftTree();
      updateActionButtons();
    }

    function toggleCurrentCaseStar() {
      if (syllabusData.length === 0) return;
      toggleCaseStarById(syllabusData[selectedIndex].id);
    }

    function setOrToggleBookmark(type, key, index, label, event) {
      if (event) event.stopPropagation();
      if (activeBookmark && activeBookmark.type === type && activeBookmark.key === key) {
        activeBookmark = null;
      } else {
        activeBookmark = { type, key, index, label };
      }
      saveActiveBookmark();
      renderLeftTree();
      updateActionButtons();
    }

    function toggleCurrentCaseBookmark() {
      if (syllabusData.length === 0) return;
      const item = syllabusData[selectedIndex];
      setOrToggleBookmark('case', item.id, selectedIndex, item.title);
    }

    function toggleCurrentSubtopicBookmark() {
      if (syllabusData.length === 0) return;
      const item = syllabusData[selectedIndex];
      setOrToggleBookmark('subtopic', item.subtopic, selectedIndex, item.subtopic);
    }

    function jumpToBookmark() {
      if (!activeBookmark || syllabusData.length === 0) return;
      let targetIndex = activeBookmark.index;

      if (activeBookmark.type === 'case') {
        const found = syllabusData.findIndex(item => item.id === activeBookmark.key);
        if (found !== -1) targetIndex = found;
      } else if (activeBookmark.type === 'subtopic') {
        const found = syllabusData.findIndex(item => item.subtopic === activeBookmark.key);
        if (found !== -1) targetIndex = found;
      } else if (activeBookmark.type === 'topic') {
        const found = syllabusData.findIndex(item => item.topic === activeBookmark.key);
        if (found !== -1) targetIndex = found;
      }

      if (targetIndex >= 0 && targetIndex < syllabusData.length) {
        selectCase(targetIndex);
      }
    }

    function renderLeftTree() {
      const tree = document.getElementById('syllabusTreeContainer');
      const totalActualCases = syllabusData.filter(isActualCaseEntry).length;
      document.getElementById('caseCountBadge').textContent = `${totalActualCases} Cases`;

      const structure = {};
      syllabusData.forEach((item, idx) => {
        if (!structure[item.topic]) structure[item.topic] = {};
        if (!structure[item.topic][item.subtopic]) structure[item.topic][item.subtopic] = [];
        structure[item.topic][item.subtopic].push({ entry: item, index: idx });
      });

      let html = '';
      for (const [topicName, subtopics] of Object.entries(structure)) {
        const isCollapsed = !!topicCollapseState[topicName];
        const safeTopicId = encodeURIComponent(topicName);
        const firstTopicIdx = Object.values(subtopics)[0][0].index;
        const isTopicBookmarked = activeBookmark && activeBookmark.type === 'topic' && activeBookmark.key === topicName;

        html += `
          <div class="topic-card ${isCollapsed ? 'collapsed' : ''} ${isTopicBookmarked ? 'bookmarked-topic' : ''}">
            <div class="topic-title" onclick="toggleTopicCollapse(decodeURIComponent('${safeTopicId}'))">
              <div class="topic-title-left">
                <span>📁</span>
                <span>${topicName}</span>
              </div>
              <div class="topic-title-right">
                <button 
                  class="sidebar-icon-btn ${isTopicBookmarked ? 'bookmark-active' : ''}" 
                  onclick="setOrToggleBookmark('topic', decodeURIComponent('${safeTopicId}'), ${firstTopicIdx}, decodeURIComponent('${safeTopicId}'), event)" 
                  title="${isTopicBookmarked ? 'Remove Topic Bookmark' : 'Bookmark Topic (Where I Left Off)'}"
                >🔖</button>
                <span class="topic-arrow">▼</span>
              </div>
            </div>
            <div class="topic-content">
        `;

        for (const [subtopicName, entries] of Object.entries(subtopics)) {
          const isSubActive = entries.some(e => e.index === selectedIndex);
          const actualCases = entries.filter(e => isActualCaseEntry(e.entry));
          const isOverviewRead = !!readRecords.overviews[subtopicName];
          const isSubBookmarked = activeBookmark && activeBookmark.type === 'subtopic' && activeBookmark.key === subtopicName;
          const safeSubId = encodeURIComponent(subtopicName);

          html += `
            <div class="subtopic-item ${isSubActive ? 'active-subtopic' : ''} ${isSubBookmarked ? 'bookmarked-row' : ''}" onclick="selectCase(${entries[0].index})">
              <span style="overflow: hidden; text-overflow: ellipsis;">• ${subtopicName} ${isOverviewRead ? '<span class="read-check-indicator" title="Overview Read">✓</span>' : ''}</span>
              <span style="display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;">
                ${actualCases.length > 0 ? `<span style="font-size: 0.7rem; color: #64748b;">${actualCases.length} ${actualCases.length === 1 ? 'case' : 'cases'}</span>` : ''}
                <button 
                  class="sidebar-icon-btn ${isSubBookmarked ? 'bookmark-active' : ''}" 
                  onclick="setOrToggleBookmark('subtopic', decodeURIComponent('${safeSubId}'), ${entries[0].index}, decodeURIComponent('${safeSubId}'), event)" 
                  title="${isSubBookmarked ? 'Remove Subtopic Bookmark' : 'Bookmark Subtopic'}"
                >🔖</button>
              </span>
            </div>
          `;

          if (actualCases.length > 0) {
            html += `<div class="case-sub-list">`;
            actualCases.forEach(e => {
              const isCaseActive = e.index === selectedIndex;
              const displayName = e.entry.title || e.entry.id.replace(/-/g, ' ');
              const isCaseRead = !!readRecords.cases[e.entry.id];
              const isStarred = !!starredCases[e.entry.id];
              const isCaseBookmarked = activeBookmark && activeBookmark.type === 'case' && activeBookmark.key === e.entry.id;
              const hasNote = !!(stickyNotes[e.entry.id] && stickyNotes[e.entry.id].trim().length > 0);
              const safeCaseTitle = encodeURIComponent(displayName);
              
              html += `
                <div class="case-node ${isCaseActive ? 'active-case' : ''} ${isCaseBookmarked ? 'bookmarked-row' : ''}" onclick="selectCase(${e.index})" title="${displayName}">
                  <span style="overflow: hidden; text-overflow: ellipsis;">⚖ ${displayName}</span>
                  <span style="display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0;">
                    <button 
                      class="sidebar-icon-btn ${isStarred ? 'star-active' : ''}" 
                      onclick="toggleCaseStarById('${e.entry.id}', event)" 
                      title="${isStarred ? 'Unstar Case' : 'Mark Case Important'}"
                    >${isStarred ? '★' : '☆'}</button>
                    <button 
                      class="sidebar-icon-btn ${isCaseBookmarked ? 'bookmark-active' : ''}" 
                      onclick="setOrToggleBookmark('case', '${e.entry.id}', ${e.index}, decodeURIComponent('${safeCaseTitle}'), event)" 
                      title="${isCaseBookmarked ? 'Remove Case Bookmark' : 'Bookmark Case (Where I Left Off)'}"
                    >🔖</button>
                    ${hasNote ? '<span class="note-pin-indicator" title="Has Sticky Note">📌</span>' : ''}
                    ${isCaseRead ? '<span class="read-check-indicator" title="Digest Read">✓</span>' : ''}
                  </span>
                </div>
              `;
            });
            html += `</div>`;
          }
        }
        html += `
            </div>
          </div>
        `;
      }
      tree.innerHTML = html;
    }

    async function fetchTextFile(path) {
      if (!path) return '';
      if (fileCache[path]) return fileCache[path];
      
      const res = await fetch(encodeURI(path) + '?t=' + Date.now());
      if (!res.ok) throw new Error(`Could not load ${path} (Status: ${res.status})`);
      const text = await res.text();
      fileCache[path] = text;
      return text;
    }

    function splitOverviewIntoCards(rawText) {
      if (!rawText || !rawText.trim()) return [];

      let paragraphs = rawText.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);

      if (paragraphs.length <= 1) {
        const lines = rawText.split('\n');
        const chunks = [];
        let cur = [];

        for (let i = 0; i < lines.length; i++) {
          const l = lines[i];
          const isHeading = /^(?:[0-9]+\.|\bGR\b|\bXPNS\b|[A-Z]\.|\#{1,3})\s*/i.test(l.trim());

          if (isHeading && cur.length > 0) {
            chunks.push(cur.join('\n').trim());
            cur = [l];
          } else {
            cur.push(l);
          }
        }
        if (cur.length > 0) chunks.push(cur.join('\n').trim());
        paragraphs = chunks.filter(Boolean);
      }

      return paragraphs.length > 0 ? paragraphs : [rawText.trim()];
    }

    function showOverviewView() {
      document.getElementById('overviewScrollArea').style.display = 'flex';
      document.getElementById('pdfFrameContainer').style.display = 'none';
      document.getElementById('pdfIframe').src = '';
    }

    function showPdfView(pdfPath) {
      document.getElementById('overviewScrollArea').style.display = 'none';
      const frameContainer = document.getElementById('pdfFrameContainer');
      frameContainer.style.display = 'flex';
      document.getElementById('pdfFileNameLabel').textContent = pdfPath;
      document.getElementById('pdfOpenNewTabBtn').href = encodeURI(pdfPath);
      document.getElementById('pdfIframe').src = encodeURI(pdfPath);
    }

    async function renderMiddleOverview() {
      showOverviewView();

      const canvas = document.getElementById('overviewCanvas');
      if (syllabusData.length === 0) return;

      const item = syllabusData[selectedIndex];
      document.getElementById('middleTag').textContent = `${item.subtopic}`;

      if (item.overviewFile) {
        canvas.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">Loading overview...</div>';
        try {
          const text = await fetchTextFile(item.overviewFile);
          
          const topicPdf = item.topicPdf || '';
          const pdfButtonHtml = topicPdf 
            ? `<button class="badge-pill-interactive badge-pdf-btn" onclick="showPdfView('${topicPdf}')">📄 View Topic PDF</button>` 
            : '';

          if (!text || !text.trim()) {
            canvas.innerHTML = `
              <div class="info-header">
                <div><h1 class="info-title">${item.subtopic}</h1></div>
                <div style="display: flex; gap: 8px; align-items: center;">
                  <span class="badge-pill badge-outline">Overview Outline</span>
                  ${pdfButtonHtml}
                </div>
              </div>
              <div style="padding: 24px; text-align: center; color: #94a3b8; font-size: 0.92rem;">
                This overview file is currently empty. Add your outline notes to <code>${item.overviewFile}</code> in GitHub.
              </div>
            `;
            return;
          }

          const chunks = splitOverviewIntoCards(text);

          let cardsHTML = '';
          chunks.forEach((chunk, index) => {
            const color = cardPalette[index % cardPalette.length];
            cardsHTML += `
              <div class="dynamic-topic-card" style="background-color: ${color};">
                <pre>${chunk}</pre>
              </div>
            `;
          });

          canvas.innerHTML = `
            <div class="info-header">
              <div><h1 class="info-title">${item.subtopic}</h1></div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <span class="badge-pill badge-outline">Overview Outline</span>
                ${pdfButtonHtml}
              </div>
            </div>
            <div class="overview-card-container">
              ${cardsHTML}
            </div>
          `;
        } catch (err) {
          const topicPdf = item.topicPdf || '';
          const pdfButtonHtml = topicPdf 
            ? `<button class="badge-pill-interactive badge-pdf-btn" onclick="showPdfView('${topicPdf}')">📄 View Topic PDF</button>` 
            : '';

          canvas.innerHTML = `
            <div class="info-header">
              <div><h1 class="info-title">${item.subtopic}</h1></div>
              <div style="display: flex; gap: 8px; align-items: center;">
                ${pdfButtonHtml}
              </div>
            </div>
            <div style="padding: 20px; color: #ef4444; font-size: 0.88rem; line-height: 1.6;">
              <strong>Could not load overview:</strong><br>
              <code>${item.overviewFile}</code><br><br>
              <span style="color:#64748b;">Please verify this file exists in your <code>Overviews/</code> folder on GitHub.</span>
            </div>
          `;
        }
      }
    }

    function parseDigestTextFile(rawText, defaultTitle) {
      const lines = rawText.split('\n');
      const nonBlank = lines.map(l => l.trim()).filter(Boolean);

      let title = defaultTitle || 'Case Brief';
      let citation = '';

      if (nonBlank.length > 0 && !isHeaderLine(nonBlank[0])) {
        title = nonBlank[0];
      }

      if (nonBlank.length > 1 && !isHeaderLine(nonBlank[1])) {
        if (nonBlank[1].includes('G.R.') || nonBlank[1].includes('Division') || nonBlank[1].includes(',')) {
          citation = nonBlank[1];
        }
      }

      const sections = {
        facts: [],
        issue: [],
        held: [],
        ratio: [],
        fallo: []
      };

      let currentSection = null;

      const headerRegex = /^(?:#{1,4}\s*)?(Facts|Issue|Held|Ruling|Ratio(?:\s+Decidendi)?|Fallo|Dispositive\s+Portion)(?:[:\s]+(.*))?$/i;

      for (let i = 0; i < lines.length; i++) {
        const rawLine = lines[i];
        const trimmed = rawLine.trim();

        const match = trimmed.match(headerRegex);

        if (match) {
          const headerWord = match[1].toLowerCase();
          const inlineText = match[2] ? match[2].trim() : '';

          if (headerWord.startsWith('fact')) {
            currentSection = 'facts';
          } else if (headerWord.startsWith('issue')) {
            currentSection = 'issue';
          } else if (headerWord.startsWith('held') || headerWord.startsWith('ruling')) {
            currentSection = 'held';
          } else if (headerWord.startsWith('ratio')) {
            currentSection = 'ratio';
          } else if (headerWord.startsWith('fallo') || headerWord.startsWith('dispositive')) {
            currentSection = 'fallo';
          }

          if (inlineText.length > 0) {
            sections[currentSection].push(inlineText);
          }
          continue;
        }

        if (currentSection) {
          if (currentSection === 'held' && /^Verbatim\s+Legal\s+Basis(?:\s*:)?\s*$/i.test(trimmed)) {
            continue;
          }
          sections[currentSection].push(rawLine);
        }
      }

      return {
        title,
        citation,
        facts: sections.facts.join('\n').trim() || 'No facts provided.',
        issue: sections.issue.join('\n').trim() || 'Issue not specified.',
        held: sections.held.join('\n').trim() || 'Ruling not specified.',
        ratio: sections.ratio.join('\n').trim() || 'Ratio decidendi.',
        fallo: sections.fallo.join('\n').trim() || 'WHEREFORE, judgment rendered accordingly.'
      };
    }

    function isHeaderLine(str) {
      return /^(?:#{1,4}\s*)?(?:Facts|Issue|Held|Ruling|Ratio|Fallo|Dispositive\s+Portion)/i.test(str.trim());
    }

    function handlePostitInput(textarea) {
      if (syllabusData.length === 0) return;
      const caseId = syllabusData[selectedIndex].id;
      stickyNotes[caseId] = textarea.value;
      saveStickyNotes();
      
      const statusEl = document.getElementById('postitSaveStatus');
      if (statusEl) statusEl.textContent = 'Saved ✓';
      
      renderLeftTree();
      updateActionButtons();
    }

    function clearCurrentPostit() {
      if (syllabusData.length === 0) return;
      const caseId = syllabusData[selectedIndex].id;
      delete stickyNotes[caseId];
      saveStickyNotes();
      const ta = document.getElementById('postitTextarea');
      if (ta) ta.value = '';
      renderLeftTree();
      updateActionButtons();
    }

    function togglePostitVisibility() {
      const box = document.getElementById('postitCardBox');
      if (!box) return;
      const currentlyHidden = box.classList.contains('hidden');
      if (currentlyHidden) {
        box.classList.remove('hidden');
        isPostitForceOpen = true;
        const ta = document.getElementById('postitTextarea');
        if (ta) ta.focus();
      } else {
        box.classList.add('hidden');
        isPostitForceOpen = false;
      }
    }

    async function renderRightDigest() {
      const canvas = document.getElementById('digestCanvas');
      if (syllabusData.length === 0) return;

      const item = syllabusData[selectedIndex];
      const existingNote = stickyNotes[item.id] || '';
      const shouldShowPostit = existingNote.trim().length > 0 || isPostitForceOpen;

      if (item.digestFile) {
        canvas.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">Loading case brief from file...</div>';
        try {
          const text = await fetchTextFile(item.digestFile);
          const parsed = parseDigestTextFile(text, item.title);

          canvas.innerHTML = `
            <div class="digest-meta-tag">${item.topic} › ${item.subtopic}</div>
            <h2 class="digest-case-heading">${parsed.title}</h2>
            ${parsed.citation ? `<div class="digest-citation">${parsed.citation}</div>` : `<div style="margin-bottom: 20px;"></div>`}

            <div id="postitCardBox" class="postit-note-wrapper ${shouldShowPostit ? '' : 'hidden'}">
              <div class="postit-header">
                <span class="postit-title">📌 Personal Bar Review Sticky Note</span>
                <div class="postit-status">
                  <span id="postitSaveStatus">${existingNote.trim() ? 'Saved ✓' : 'Auto-saves as you type'}</span>
                  <button class="postit-clear-btn" onclick="clearCurrentPostit()" title="Clear Note">Clear</button>
                </div>
              </div>
              <textarea 
                id="postitTextarea" 
                class="postit-textarea" 
                placeholder="Write your quick doctrinal takeaways, exam tips, or mnemonics for this case..."
                oninput="handlePostitInput(this)"
              ></textarea>
            </div>

            <div class="digest-section">
              <div class="section-label facts-label">📋 RELEVANT FACTS (BAR EXAMINATION STYLE)</div>
              <div class="digest-text-content">${parsed.facts}</div>
            </div>

            <div class="digest-section">
              <div class="section-label issue-label">❓ ISSUE</div>
              <div class="digest-text-content"><strong>${parsed.issue}</strong></div>
            </div>

            <div class="digest-section">
              <div class="section-label held-label">⚖ HELD</div>
              <div class="verbatim-box">${parsed.held}</div>
            </div>

            <div class="digest-section">
              <div class="section-label ratio-label">🧠 RATIO DECIDENDI</div>
              <div class="digest-text-content" id="activeRatioText">${parsed.ratio}</div>
            </div>

            <div class="digest-section">
              <div class="section-label fallo-label">📜 FALLO</div>
              <div class="fallo-box">${parsed.fallo}</div>
            </div>
          `;

          const ta = document.getElementById('postitTextarea');
          if (ta) ta.value = existingNote;

        } catch (err) {
          canvas.innerHTML = `
            <div style="padding: 24px; color: #ef4444; font-size: 0.9rem; line-height: 1.6;">
              <strong>Could not load digest file:</strong><br>
              <code>${item.digestFile}</code><br><br>
              <span style="color: #94a3b8;">${err.message}</span>
            </div>
          `;
        }
      }
    }

    function toggleOverviewRead() {
      if (syllabusData.length === 0) return;
      const subtopicKey = syllabusData[selectedIndex].subtopic;
      readRecords.overviews[subtopicKey] = !readRecords.overviews[subtopicKey];
      saveReadRecords();
      renderLeftTree();
      updateActionButtons();
    }

    function toggleCaseRead() {
      if (syllabusData.length === 0) return;
      const caseId = syllabusData[selectedIndex].id;
      readRecords.cases[caseId] = !readRecords.cases[caseId];
      saveReadRecords();
      renderLeftTree();
      updateActionButtons();
    }

    function updateActionButtons() {
      if (syllabusData.length === 0) return;
      const curItem = syllabusData[selectedIndex];

      // Overview Read Button
      const isOverviewRead = !!readRecords.overviews[curItem.subtopic];
      const overviewBtn = document.getElementById('overviewReadBtn');
      if (overviewBtn) {
        overviewBtn.classList.toggle('is-read', isOverviewRead);
        overviewBtn.innerHTML = isOverviewRead ? '✓ Read' : 'Mark Read';
      }

      // Overview Bookmark Button
      const isSubBookmarked = activeBookmark && activeBookmark.type === 'subtopic' && activeBookmark.key === curItem.subtopic;
      const overviewBookmarkBtn = document.getElementById('overviewBookmarkBtn');
      if (overviewBookmarkBtn) {
        overviewBookmarkBtn.classList.toggle('is-bookmarked', !!isSubBookmarked);
        overviewBookmarkBtn.innerHTML = isSubBookmarked ? '🔖 Bookmarked' : '🔖 Bookmark';
      }

      // Case Star Button
      const isStarred = !!starredCases[curItem.id];
      const caseStarBtn = document.getElementById('caseStarBtn');
      if (caseStarBtn) {
        caseStarBtn.classList.toggle('is-starred', isStarred);
        caseStarBtn.innerHTML = isStarred ? '★ Starred' : '☆ Star';
      }

      // Case Bookmark Button
      const isCaseBookmarked = activeBookmark && activeBookmark.type === 'case' && activeBookmark.key === curItem.id;
      const caseBookmarkBtn = document.getElementById('caseBookmarkBtn');
      if (caseBookmarkBtn) {
        caseBookmarkBtn.classList.toggle('is-bookmarked', !!isCaseBookmarked);
        caseBookmarkBtn.innerHTML = isCaseBookmarked ? '🔖 Bookmarked' : '🔖 Bookmark';
      }

      // Case Read Button
      const isCaseRead = !!readRecords.cases[curItem.id];
      const caseBtn = document.getElementById('caseReadBtn');
      if (caseBtn) {
        caseBtn.classList.toggle('is-read', isCaseRead);
        caseBtn.innerHTML = isCaseRead ? '✓ Read' : 'Mark Read';
      }

      // Sticky Note Button
      const hasNote = !!(stickyNotes[curItem.id] && stickyNotes[curItem.id].trim().length > 0);
      const postitBtn = document.getElementById('postitToggleBtn');
      if (postitBtn) {
        postitBtn.classList.toggle('has-note', hasNote);
        postitBtn.innerHTML = hasNote ? '📌 Note •' : '📌 Note';
      }

      // Top App Bar Jump to Bookmark Button
      const jumpBtn = document.getElementById('jumpBookmarkBtn');
      if (jumpBtn) {
        if (activeBookmark) {
          jumpBtn.style.display = 'inline-flex';
          jumpBtn.title = `Jump to bookmarked ${activeBookmark.type}: ${activeBookmark.label}`;
        } else {
          jumpBtn.style.display = 'none';
        }
      }
    }

    function nextCase() {
      if (syllabusData.length === 0) return;
      let nextIdx = selectedIndex + 1;
      while (nextIdx < syllabusData.length && !isActualCaseEntry(syllabusData[nextIdx])) {
        nextIdx++;
      }

      if (nextIdx < syllabusData.length) {
        selectCase(nextIdx);
      } else {
        alert("You have reached the last case in the syllabus.");
      }
    }

    function selectCase(index) {
      selectedIndex = index;
      isPostitForceOpen = false;
      if (syllabusData[index]) {
        topicCollapseState[syllabusData[index].topic] = false;
      }
      renderApp();

      setTimeout(() => {
        const activeItem = document.querySelector('.case-node.active-case, .subtopic-item.active-subtopic');
        if (activeItem) {
          activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, 80);
    }

    function copyRatio() {
      const txt = document.getElementById('activeRatioText')?.innerText;
      if (txt) {
        navigator.clipboard.writeText(txt).then(() => alert("Ratio Decidendi copied!"));
      }
    }
  </script>
</body>
</html>
