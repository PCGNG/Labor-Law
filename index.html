<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labor Law Case Digests | PCGNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0d121c;
      --bg-sidebar: #090e17;
      --panel-dark: #121927;
      --border-dark: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
      --emerald-accent: #10b981;
      --crimson-accent: #ef4444;
      
      /* Visual Infographic Pastel Tone Palette */
      --info-bg: #eceae3;
      --info-text: #1e293b;
      --info-card-facts: #e2ede5;
      --info-card-turning: #fde8e7;
      --info-card-issue: #fae0e4;
      --info-card-rationale: #f4ecdf;
      --info-card-doctrine: #daf0e4;
      --info-card-quote: #fdf5d6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP APP BAR */
    header.app-bar {
      height: 52px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .badge-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border-color: #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }

    .btn-primary {
      background: var(--gold-accent);
      color: #000;
    }
    .btn-primary:hover {
      background: #d97706;
    }

    .btn-emerald {
      background: #059669;
      color: #fff;
    }
    .btn-emerald:hover {
      background: #10b981;
    }

    .select-dropdown {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      max-width: 280px;
      outline: none;
    }

    /* MAIN THREE COLUMN WORKSPACE */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* COLUMN 1: SYLLABUS TREE NAVIGATION */
    .syllabus-sidebar {
      width: 290px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1420;
    }

    .sidebar-head h4 {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }

    .tree-scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
    }

    .topic-group {
      margin-bottom: 12px;
    }

    .topic-title-bar {
      padding: 6px 8px;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .subtopic-group {
      margin-left: 10px;
      margin-top: 4px;
      border-left: 1.5px solid #1e293b;
      padding-left: 8px;
    }

    .subtopic-title-bar {
      font-size: 0.7rem;
      font-weight: 600;
      color: #94a3b8;
      padding: 4px 6px;
    }

    .case-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      margin-top: 2px;
      border-radius: 5px;
      font-size: 0.72rem;
      color: #cbd5e1;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .case-nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .case-nav-item.active {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-accent);
      font-weight: 700;
      border-left: 2px solid var(--gold-accent);
    }

    /* PANE WORKSPACE */
    .content-panes-wrapper {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .pane-header-strip {
      height: 38px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #0e1624;
    }

    /* COLUMN 2: INFOGRAPHIC OVERVIEW (LEFT PANE) */
    .pane-left-infographic {
      flex: 1;
      background: #0f172a;
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .infographic-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #111a2e;
      display: flex;
      justify-content: center;
    }

    /* The exact Infographic Card Canvas from the reference */
    .infographic-sheet {
      width: 100%;
      max-width: 580px;
      background-color: var(--info-bg);
      color: var(--info-text);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-header {
      border-bottom: 2px solid #ded9cb;
      padding-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.15;
      color: #111827;
      text-transform: uppercase;
    }

    .info-subhead {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      margin-top: 4px;
    }

    .info-badge-stamp {
      text-align: right;
      flex-shrink: 0;
    }

    .info-badge-stamp .tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #475569;
      display: block;
    }

    .info-badge-stamp .sub-tag {
      font-size: 0.62rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .info-card {
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-card.card-facts { background-color: var(--info-card-facts); }
    .info-card.card-turning { background-color: var(--info-card-turning); }
    .info-card.card-issue { background-color: var(--info-card-issue); }
    .info-card.card-rationale { background-color: var(--info-card-rationale); }
    .info-card.card-doctrine { background-color: var(--info-card-doctrine); }
    .info-card.card-quote { background-color: var(--info-card-quote); }

    .info-card-title {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-card p {
      font-size: 0.75rem;
      line-height: 1.45;
      color: #1e293b;
    }

    /* COLUMN 3: CASE BRIEF DIGEST (RIGHT PANE) */
    .pane-right-digest {
      flex: 1.15;
      background: var(--panel-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .digest-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 30px;
    }

    .digest-meta-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .digest-case-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 6px;
    }

    .digest-citation {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dark);
    }

    .digest-section {
      margin-bottom: 22px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label.facts-label { color: #fbbf24; }
    .section-label.issue-label { color: #38bdf8; }
    .section-label.rules-label { color: #a78bfa; }
    .section-label.ruling-label { color: #34d399; }
    .section-label.ratio-label { color: #f472b6; }
    .section-label.fallo-label { color: #f87171; }

    .digest-text-content {
      font-size: 0.86rem;
      line-height: 1.65;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 16px;
      border-radius: 8px;
    }

    .verbatim-box {
      font-style: italic;
      border-left: 3px solid #34d399;
      background: rgba(5, 150, 105, 0.08);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      color: #e2e8f0;
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .fallo-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #fca5a5;
    }

    /* MODAL DIALOGS */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-backdrop.open { display: flex; }

    .modal-window {
      background: #111827;
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      width: 90%;
      max-width: 820px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d121c;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .form-control {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--gold-accent);
    }

    textarea.form-control {
      min-height: 70px;
      resize: vertical;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d121c;
    }

    /* SCROLLBAR STYLING */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #263346; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4d66; }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="app-bar">
    <div class="brand-block">
      <span class="brand-title">⚖ Labor Law Case Digests</span>
      <span class="badge-pill">Bar Exam Reviewer</span>
    </div>

    <div class="nav-actions">
      <button class="btn btn-secondary" onclick="prevCase()">❮ Prev</button>
      <select id="quickJumpSelect" class="select-dropdown" onchange="jumpToCase(this.value)">
        <!-- Populated via script -->
      </select>
      <button class="btn btn-secondary" onclick="nextCase()">Next ❯</button>
      
      <button class="btn btn-emerald" onclick="openInputModal()">＋ Manage / Input Cases</button>
      <button class="btn btn-secondary" onclick="exportDataJSON()">Export (JSON)</button>
      <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main class="workspace">
    <!-- SYLLABUS NAVIGATOR -->
    <aside class="syllabus-sidebar">
      <div class="sidebar-head">
        <h4>Syllabus Navigator</h4>
        <span id="caseCountBadge" class="badge-pill">0 Cases</span>
      </div>
      <div class="tree-scroll-container" id="treeContainer">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- SPLIT CONTENT PANES -->
    <div class="content-panes-wrapper">
      <!-- LEFT PANE: TOPIC & INFOGRAPHIC CARDS -->
      <section class="pane-left-infographic">
        <div class="pane-header-strip">
          <span>● Visual Infographic Overview</span>
          <span id="leftPaneSubtopicTag" style="color: var(--gold-accent);">Topic Overview</span>
        </div>
        <div class="infographic-viewport">
          <div class="infographic-sheet" id="infographicContent">
            <!-- Infographic loaded dynamically -->
          </div>
        </div>
      </section>

      <!-- RIGHT PANE: BAR EXAM CASE DIGEST -->
      <section class="pane-right-digest">
        <div class="pane-header-strip">
          <span>⚖ Bar Exam Case Digest & Ruling</span>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.68rem;" onclick="copyRatioDecidendi()">Copy Ratio</button>
            <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.68rem; color: #f87171;" onclick="deleteCurrentCase()">Delete</button>
          </div>
        </div>
        <div class="digest-viewport" id="digestContent">
          <!-- Digest loaded dynamically -->
        </div>
      </section>
    </div>
  </main>

  <!-- CASE INPUT & MANAGEMENT MODAL -->
  <div class="modal-backdrop" id="caseModal">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 1rem; color: #fff;">Input New Case & Topic</h3>
        <button class="btn btn-secondary" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editCaseId">
        
        <div class="form-group-row">
          <div class="form-group">
            <label>Overarching Topic</label>
            <input type="text" id="inpTopic" class="form-control" placeholder="e.g., Book III: Conditions of Employment">
          </div>
          <div class="form-group">
            <label>Sub-Topic</label>
            <input type="text" id="inpSubtopic" class="form-control" placeholder="e.g., Service Charges vs. Qualified Theft">
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label>Case Title</label>
            <input type="text" id="inpTitle" class="form-control" placeholder="e.g., Janice L. Teologo v. People">
          </div>
          <div class="form-group">
            <label>Citation & Date</label>
            <input type="text" id="inpCitation" class="form-control" placeholder="G.R. No. 238383, April 02, 2025">
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #1f2937;">
        <h4 style="font-size: 0.75rem; color: var(--gold-accent); text-transform: uppercase;">Left Pane: Infographic Overviews</h4>

        <div class="form-group-row">
          <div class="form-group">
            <label>Badge / Category</label>
            <input type="text" id="inpBadge" class="form-control" placeholder="QUALIFIED THEFT / LABOR STANDARDS">
          </div>
          <div class="form-group">
            <label>Legal Basis / Codal</label>
            <input type="text" id="inpLegalBasis" class="form-control" placeholder="Article 96 Labor Code / Art. 310 RPC">
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label>Brief Facts (Infographic)</label>
            <textarea id="inpInfoFacts" class="form-control" placeholder="Concise summary for the green card..."></textarea>
          </div>
          <div class="form-group">
            <label>Turning Point</label>
            <textarea id="inpInfoTurning" class="form-control" placeholder="The turning point event..."></textarea>
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label>Rationale (SC Summary)</label>
            <textarea id="inpInfoRationale" class="form-control" placeholder="Core rationale in brief..."></textarea>
          </div>
          <div class="form-group">
            <label>Doctrine Summary & Key Takeaway</label>
            <textarea id="inpInfoDoctrine" class="form-control" placeholder="Controlling rule statement..."></textarea>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #1f2937;">
        <h4 style="font-size: 0.75rem; color: #38bdf8; text-transform: uppercase;">Right Pane: Complete Bar Examination Brief</h4>

        <div class="form-group">
          <label>Facts (Bar Examination Style)</label>
          <textarea id="inpBriefFacts" class="form-control" style="min-height: 90px;" placeholder="Bar style facts. Direct, concise, using names instead of petitioner/respondent..."></textarea>
        </div>

        <div class="form-group">
          <label>Issue (Direct Question Form)</label>
          <input type="text" id="inpBriefIssue" class="form-control" placeholder="Can store managers be held liable for Qualified Theft for withholding service charges?">
        </div>

        <div class="form-group">
          <label>Specific Provisions Relied Upon</label>
          <input type="text" id="inpBriefProvisions" class="form-control" placeholder="Article 96 of the Labor Code; Article 310 in relation to Article 308 of the Revised Penal Code.">
        </div>

        <div class="form-group">
          <label>Verbatim Supreme Court Legal Basis</label>
          <textarea id="inpBriefVerbatim" class="form-control" style="min-height: 80px;" placeholder="Quote verbatim the Supreme Court's exact words..."></textarea>
        </div>

        <div class="form-group">
          <label>Ratio Decidendi</label>
          <textarea id="inpBriefRatio" class="form-control" style="min-height: 90px;" placeholder="In-depth explanation and controlling legal analysis..."></textarea>
        </div>

        <div class="form-group">
          <label>Fallo (Dispositive Portion)</label>
          <textarea id="inpBriefFallo" class="form-control" placeholder="WHEREFORE, the petition is DENIED..."></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <div>
          <button class="btn btn-secondary" onclick="copyDatabaseAsCode()">Copy Data to Clipboard (Code)</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-emerald" onclick="saveCaseFromForm()">Save Case</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* LABOR LAW CASE DATABASE */
    const DEFAULT_LABOR_LAW_DATABASE = [
      {
        id: "teologo-v-people",
        topic: "Book III: Conditions of Employment",
        subtopic: "Service Charges vs. Qualified Theft",
        overview: {
          badge: "QUALIFIED THEFT / LABOR",
          title: "TEOLOGO & DELOS SANTOS v. PEOPLE",
          legalBasis: "Art. 96 Labor Code / Art. 308 & 310 RPC",
          factsSummary: "From June to October 2009, Janice Teologo and Jennifer Delos Santos served as store managers at a pizza branch. They withheld and failed to distribute the collected employee service charges, keeping the money instead.",
          turningPoint: "The prosecution charged them with Qualified Theft for gravely abusing their managerial positions of trust and confidence to pocket collected employee service charges.",
          issueQuestion: "Can store managers be held liable for Qualified Theft for withholding and misappropriating collected employee service charges?",
          rationale: "All elements of Qualified Theft were met: taking of personal property (service charges belonging to employees) without consent, with intent to gain, and committed with grave abuse of confidence.",
          doctrine: "Withholding or misappropriating funds intended for employees (such as statutory service charges) constitutes Qualified Theft when committed by managerial employees abusing their position of trust.",
          takeawayQuote: "Managerial abuse of trust = Qualified Theft. Service charges belong to the employees by statutory mandate."
        },
        caseDigest: {
          title: "Janice L. Teologo and Jennifer Delos Santos v. People of the Philippines",
          citation: "G.R. No. 238383, April 02, 2025 • Second Division • Kho, Jr., J.",
          facts: "Janice Teologo and Jennifer Delos Santos were branch managers of a pizza store. The franchise owner regularly issued checks representing statutory service charges for encashment and distribution to rank-and-file employees. Teologo and Delos Santos made employees sign payroll sheets acknowledging receipt, but withheld the cash and diverted the funds. When an internal audit commenced, they claimed the funds were kept as 'forced savings.'",
          issue: "Are branch managers guilty of Qualified Theft under Article 310 of the Revised Penal Code for withholding and misappropriating statutory service charges due to rank-and-file employees?",
          provisions: "Article 96 of the Labor Code of the Philippines (as amended by R.A. No. 11360); Article 308 and Article 310 of the Revised Penal Code.",
          verbatimRuling: "\"The elements of Qualified Theft are: (a) taking of personal property; (b) that the said property belongs to another; (c) that the said taking be done with intent to gain; (d) that it be done without the owner's consent; (e) that it be accomplished without the use of violence or intimidation against persons, nor of force upon things; and (f) that it be done with grave abuse of confidence. All elements are attendant here.\"",
          ratioDecidendi: "Service charges collected by establishments belong to the employees pursuant to Article 96 of the Labor Code. When managerial personnel entrusted with the encashment and distribution of these funds pocket them, the crime committed is Qualified Theft because their managerial position involves high trust and confidence which was gravely abused to convert the funds.",
          fallo: "WHEREFORE, the petition is DENIED. The Decision of the Court of Appeals convicting petitioners of Qualified Theft under Article 310 in relation to Article 308 of the Revised Penal Code is AFFIRMED with MODIFICATIONS as to the penalty."
        }
      }
    ];

    // Local Storage or Default fallback
    let cases = JSON.parse(localStorage.getItem('LABOR_LAW_DATA')) || DEFAULT_LABOR_LAW_DATABASE;
    let currentCaseIndex = 0;

    function saveState() {
      localStorage.setItem('LABOR_LAW_DATA', JSON.stringify(cases));
      renderSidebar();
      renderQuickJump();
      renderCurrentCase();
    }

    function renderSidebar() {
      const treeContainer = document.getElementById('treeContainer');
      document.getElementById('caseCountBadge').textContent = `${cases.length} Cases`;

      // Group by topic and subtopic
      const grouped = {};
      cases.forEach((item, index) => {
        if (!grouped[item.topic]) grouped[item.topic] = {};
        if (!grouped[item.topic][item.subtopic]) grouped[item.topic][item.subtopic] = [];
        grouped[item.topic][item.subtopic].push({ ...item, globalIndex: index });
      });

      let html = '';
      for (const [topic, subtopics] of Object.entries(grouped)) {
        html += `
          <div class="topic-group">
            <div class="topic-title-bar">
              <span>📁</span>
              <span>${topic}</span>
            </div>
        `;
        for (const [subtopic, caseList] of Object.entries(subtopics)) {
          html += `
            <div class="subtopic-group">
              <div class="subtopic-title-bar">• ${subtopic}</div>
          `;
          caseList.forEach(c => {
            const activeCls = c.globalIndex === currentCaseIndex ? 'active' : '';
            html += `
              <div class="case-nav-item ${activeCls}" onclick="selectCase(${c.globalIndex})">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">📄 ${c.caseDigest.title.split('v.')[0]}</span>
              </div>
            `;
          });
          html += `</div>`;
        }
        html += `</div>`;
      }
      treeContainer.innerHTML = html;
    }

    function renderQuickJump() {
      const select = document.getElementById('quickJumpSelect');
      select.innerHTML = cases.map((c, i) => `
        <option value="${i}" ${i === currentCaseIndex ? 'selected' : ''}>
          ${c.subtopic}: ${c.caseDigest.title.substring(0, 32)}...
        </option>
      `).join('');
    }

    function renderCurrentCase() {
      if (cases.length === 0) {
        document.getElementById('infographicContent').innerHTML = '<p style="text-align: center; color: #64748b;">No cases found. Click "Manage / Input Cases" to add your first digest.</p>';
        document.getElementById('digestContent').innerHTML = '<p style="text-align: center; color: #64748b;">No digest available.</p>';
        return;
      }

      const item = cases[currentCaseIndex];
      document.getElementById('leftPaneSubtopicTag').textContent = `${item.topic} › ${item.subtopic}`;

      // Render Left Infographic
      document.getElementById('infographicContent').innerHTML = `
        <div class="info-header">
          <div>
            <h1 class="info-title">${item.overview.title}</h1>
            <div class="info-subhead">${item.caseDigest.citation}</div>
          </div>
          <div class="info-badge-stamp">
            <span class="tag">${item.overview.badge}</span>
            <span class="sub-tag">${item.overview.legalBasis}</span>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-facts">
            <div class="info-card-title">📅 FACTS</div>
            <p>${item.overview.factsSummary}</p>
          </div>
          <div class="info-card card-rationale">
            <div class="info-card-title">⚖ RATIONALE</div>
            <p>${item.overview.rationale}</p>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-turning">
            <div class="info-card-title">⚡ TURNING POINT</div>
            <p>${item.overview.turningPoint}</p>
          </div>
          <div class="info-card card-doctrine">
            <div class="info-card-title">🛡 DOCTRINE</div>
            <p>${item.overview.doctrine}</p>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-issue">
            <div class="info-card-title">❓ ISSUE</div>
            <p><strong>${item.overview.issueQuestion}</strong></p>
          </div>
          <div class="info-card card-quote">
            <div class="info-card-title">💡 KEY TAKEAWAY</div>
            <p style="font-weight: 700;">"${item.overview.takeawayQuote}"</p>
          </div>
        </div>
      `;

      // Render Right Bar Brief
      document.getElementById('digestContent').innerHTML = `
        <div class="digest-meta-tag">${item.topic} › ${item.subtopic}</div>
        <h2 class="digest-case-heading">${item.caseDigest.title}</h2>
        <div class="digest-citation">${item.caseDigest.citation}</div>

        <div class="digest-section">
          <div class="section-label facts-label">📋 RELEVANT FACTS (BAR EXAMINATION STYLE)</div>
          <div class="digest-text-content">${item.caseDigest.facts}</div>
        </div>

        <div class="digest-section">
          <div class="section-label issue-label">❓ ISSUE</div>
          <div class="digest-text-content"><strong>${item.caseDigest.issue}</strong></div>
        </div>

        <div class="digest-section">
          <div class="section-label rules-label">📖 PROVISIONS OF LAW AND RULES RELIED UPON</div>
          <div class="digest-text-content">${item.caseDigest.provisions}</div>
        </div>

        <div class="digest-section">
          <div class="section-label ruling-label">⚖ VERBATIM SUPREME COURT LEGAL BASIS</div>
          <div class="verbatim-box">${item.caseDigest.verbatimRuling}</div>
        </div>

        <div class="digest-section">
          <div class="section-label ratio-label">🧠 RATIO DECIDENDI</div>
          <div class="digest-text-content" id="currentRatioText">${item.caseDigest.ratioDecidendi}</div>
        </div>

        <div class="digest-section">
          <div class="section-label fallo-label">📜 FALLO (DISPOSITIVE PORTION)</div>
          <div class="fallo-box">${item.caseDigest.fallo}</div>
        </div>
      `;
    }

    function selectCase(index) {
      currentCaseIndex = index;
      renderSidebar();
      renderQuickJump();
      renderCurrentCase();
    }

    function prevCase() {
      if (currentCaseIndex > 0) selectCase(currentCaseIndex - 1);
    }

    function nextCase() {
      if (currentCaseIndex < cases.length - 1) selectCase(currentCaseIndex + 1);
    }

    function jumpToCase(index) {
      selectCase(parseInt(index));
    }

    function copyRatioDecidendi() {
      const ratio = document.getElementById('currentRatioText').innerText;
      navigator.clipboard.writeText(ratio).then(() => {
        alert('Ratio Decidendi copied to clipboard!');
      });
    }

    function deleteCurrentCase() {
      if (confirm('Are you sure you want to delete this case digest?')) {
        cases.splice(currentCaseIndex, 1);
        if (currentCaseIndex >= cases.length) currentCaseIndex = Math.max(0, cases.length - 1);
        saveState();
      }
    }

    /* MODAL & DATA INPUT */
    function openInputModal() {
      document.getElementById('editCaseId').value = '';
      document.getElementById('modalTitle').textContent = 'Input New Case & Topic';
      // Clear inputs
      document.querySelectorAll('#caseModal input, #caseModal textarea').forEach(el => el.value = '');
      document.getElementById('caseModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('caseModal').classList.remove('open');
    }

    function saveCaseFromForm() {
      const topic = document.getElementById('inpTopic').value.trim() || 'General Labor Law';
      const subtopic = document.getElementById('inpSubtopic').value.trim() || 'General Principles';
      const title = document.getElementById('inpTitle').value.trim() || 'Untitled Case';
      const citation = document.getElementById('inpCitation').value.trim() || 'Supreme Court';

      const newCase = {
        id: 'case-' + Date.now(),
        topic: topic,
        subtopic: subtopic,
        overview: {
          badge: document.getElementById('inpBadge').value.trim() || 'LABOR DOCTRINE',
          title: title.split('v.')[0] || title,
          legalBasis: document.getElementById('inpLegalBasis').value.trim() || 'Labor Code of the Philippines',
          factsSummary: document.getElementById('inpInfoFacts').value.trim() || 'Summary of facts.',
          turningPoint: document.getElementById('inpInfoTurning').value.trim() || 'Turning point event.',
          issueQuestion: document.getElementById('inpBriefIssue').value.trim() || 'Core legal issue.',
          rationale: document.getElementById('inpInfoRationale').value.trim() || 'Supreme Court rationale.',
          doctrine: document.getElementById('inpInfoDoctrine').value.trim() || 'Controlling doctrine.',
          takeawayQuote: document.getElementById('inpInfoDoctrine').value.trim() || 'Key rule.'
        },
        caseDigest: {
          title: title,
          citation: citation,
          facts: document.getElementById('inpBriefFacts').value.trim() || 'Facts of the case.',
          issue: document.getElementById('inpBriefIssue').value.trim() || 'Issue question.',
          provisions: document.getElementById('inpBriefProvisions').value.trim() || 'Provisions cited.',
          verbatimRuling: document.getElementById('inpBriefVerbatim').value.trim() || 'Verbatim legal basis.',
          ratioDecidendi: document.getElementById('inpBriefRatio').value.trim() || 'Ratio decidendi.',
          fallo: document.getElementById('inpBriefFallo').value.trim() || 'Fallo.'
        }
      };

      cases.push(newCase);
      currentCaseIndex = cases.length - 1;
      saveState();
      closeModal();
    }

    function exportDataJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cases, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "labor_law_cases.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function copyDatabaseAsCode() {
      const code = "const DEFAULT_LABOR_LAW_DATABASE = " + JSON.stringify(cases, null, 2) + ";";
      navigator.clipboard.writeText(code).then(() => {
        alert('Case database copied as code! You can now paste this directly into index.html on GitHub.');
      });
    }

    // Initialize
    renderSidebar();
    renderQuickJump();
    renderCurrentCase();
  </script>
</body>
</html>
