                  factsBox: "From June to October 2009, Janice L. Teologo and Jennifer Delos Santos served as store managers at the Shakey's Pizza branch in Angono, Rizal. They were accused of withholding and failing to distribute the employees' statutory share of gathered service charges, converting the funds for their own benefit instead.",
                  turningPoint: "The prosecution charged them with Qualified Theft, arguing that as branch managers, they abused their high position of trust and confidence to pocket the money. In their defense, they claimed that the undistributed service charges were kept as 'forced savings' or 'safety funds' for the employees and not stolen.",

                // FULL CASE DIGEST FOR BAR REVIEW (Right Pane)
                facts: "Janice L. Teologo and Jennifer Delos Santos were branch managers of a Shakey's Pizza branch operated by franchise holder Big G Philfoods & Entertainment, Inc. Big G regularly issued checks for encashment and distribution to rank-and-file employees representing their statutory collected shares in branch service charges. Big G also prepared monthly payroll sheets reflecting the specific computation each worker was entitled to receive.\n\nEmployees Ingimar Buenaventura and Mark Christopher Quetua were made to sign payroll sheets acknowledging receipt, but Teologo and Delos Santos withheld the money and never disbursed the amounts. The employees reported the scheme after an internal audit commenced. The managers claimed that the service charges were withheld and reallocated pursuant to an unwritten company policy because the employees had incomplete requirements, but they failed to identify any workers who supposedly received the redistributed funds.\n\nThe RTC convicted Teologo and Delos Santos of Qualified Theft under Article 310 in relation to Article 308 of the Revised Penal Code, which the CA affirmed.",
                issue: "Are branch managers who unlawfully withhold and misappropriate the statutory service charges of employees guilty of Qualified Theft under Article 310 in relation to Article 308 of the Revised Penal Code?",

                ],
                verbatimRuling: `"The elements of Qualified Theft under Article 310 in relation to Article 308 of the RPC are: (a) there was a taking of personal property; (b) the property belongs to another; (c) the taking was done with intent to gain; (d) the taking was done without the consent of the owner; (e) the taking was accomplished without the use of violence against or intimidation of persons or force upon things; and (f) the theft was committed with grave abuse of confidence."\n\n"Managerial personnel are reposed with the highest degree of trust and confidence by their employer. When branch managers utilize their administrative authority and custodianship over employee benefits—specifically the mandatory service charges governed by labor standards—to withhold, misapply, and convert such funds for unauthorized ends under the pretext of 'forced savings,' the qualifying circumstance of grave abuse of confidence is present beyond reasonable doubt."`,

    const allCases = [];

            topicId: topic.id,
            topicTitle: topic.title,
            subtopicId: sub.id,

    function renderSyllabusTree() {
      const container = document.getElementById('tree-container');
      const select = document.getElementById('case-jump-select');
      container.innerHTML = '';
      select.innerHTML = '<option value="" disabled selected>Quick Jump to Case...</option>';

      SYLLABUS_DATABASE.forEach(topic => {
        const topicWrapper = document.createElement('div');
        topicWrapper.className = 'rounded-lg border border-slate-800 bg-slate-900/60 overflow-hidden mb-2';

        const topicHeader = document.createElement('div');
        topicHeader.className = 'p-2.5 bg-slate-850/90 text-amber-300 font-bold flex items-center justify-between cursor-pointer border-b border-slate-800/80';
        topicHeader.innerHTML = `
          <div class="flex items-center space-x-2 truncate">
            <i data-lucide="book" class="w-3.5 h-3.5 text-amber-400 flex-shrink-0"></i>
            <span class="truncate text-xs">${topic.title}</span>
          </div>
          <span class="text-[9px] font-mono bg-slate-900 text-slate-400 px-1 rounded">${topic.codeRef}</span>
        `;
        topicWrapper.appendChild(topicHeader);

        const subContainer = document.createElement('div');
        subContainer.className = 'p-1.5 space-y-1.5';

        topic.subtopics.forEach(sub => {
          const subDiv = document.createElement('div');
          subDiv.className = 'pl-2 space-y-1';

          const subHeader = document.createElement('div');
          subHeader.className = 'text-[11px] font-semibold text-slate-300 flex items-center gap-1.5 pt-1';
          subHeader.innerHTML = `
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
            <span>${sub.title}</span>
          `;
          subDiv.appendChild(subHeader);

          sub.cases.forEach(caseItem => {
            const isSelected = allCases[currentCaseIndex].id === caseItem.id;
            const caseBtn = document.createElement('button');
            caseBtn.className = `w-full text-left px-2 py-1.5 rounded text-[11px] transition flex items-center justify-between ${
              isSelected 
                ? 'bg-amber-500/20 text-amber-200 border border-amber-500/40 font-semibold shadow-sm' 
                : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
            }`;
            caseBtn.innerHTML = `
              <span class="truncate flex items-center gap-1.5">
                <i data-lucide="file-check" class="w-3 h-3 ${isSelected ? 'text-amber-400' : 'text-slate-600'}"></i>
                ${caseItem.shortTitle}
              </span>
              <span class="text-[9px] font-mono opacity-70">${caseItem.grNo.replace('G.R. No. ', '')}</span>
            `;
            caseBtn.onclick = () => {
              const idx = allCases.findIndex(c => c.id === caseItem.id);
              if (idx !== -1) {
                currentCaseIndex = idx;
                renderActiveCase();
              }
            };
            subDiv.appendChild(caseBtn);

            // Populate Jump Select
            const opt = document.createElement('option');
            opt.value = caseItem.id;
            opt.textContent = `${caseItem.shortTitle} (${caseItem.grNo})`;
            select.appendChild(opt);
          });

          subContainer.appendChild(subDiv);
        });

        topicWrapper.appendChild(subContainer);
        container.appendChild(topicWrapper);
      });

      document.getElementById('case-count-badge').textContent = `${allCases.length} Cases`;
      lucide.createIcons();
    }

              <!-- KEY TAKEAWAY CARD -->
              <div class="bg-poster-cardGold border border-amber-300 rounded-xl p-4 shadow-sm">
                <div class="flex items-center space-x-2 text-amber-950 font-bold text-xs uppercase tracking-wider mb-2 font-mono">
                  <span class="p-1 rounded-full bg-amber-200 text-amber-900">
                    <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
                  </span>
                  <span>KEY TAKEAWAY</span>
                </div>
                <p class="text-xs font-bold text-amber-950 leading-snug italic font-serif">
                  "${info.keyTakeaway}"
                </p>
              </div>
            </div>

          </div>

          <!-- Bottom Footer Bar of Poster -->
          <div class="pt-3 border-t border-stone-300 flex items-center justify-between text-[10px] font-mono text-stone-500">
            <span>Supreme Court of the Philippines Jurisprudence</span>
            <span>Philippine Bar Exam Reviewer</span>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // -------------------------------------------------------------
    // RENDER RIGHT PANE: BAR-STYLE CASE BRIEF
    // -------------------------------------------------------------
    function renderDigestPane(item) {
      const container = document.getElementById('digest-content');
      document.getElementById('digest-gr-badge').textContent = item.grNo;

      container.className = `flex-1 overflow-y-auto p-5 md:p-8 space-y-6 ${isSerifFont ? 'font-serif' : 'font-sans'}`;

      container.innerHTML = `
        <!-- Case Caption -->
        <div class="border-b border-slate-800 pb-5">
          <div class="flex flex-wrap items-center gap-2 mb-2 font-mono text-xs">
            <span class="bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30 font-semibold">
              ${item.category}
            </span>
            <span class="text-slate-600">•</span>
            <span class="text-sky-400 font-semibold">${item.grNo}</span>
            <span class="text-slate-600">•</span>
            <span class="text-slate-400">${item.date}</span>
            <span class="text-slate-600">•</span>
            <span class="text-emerald-400 font-mono">Ponente: ${item.ponencia}</span>
          </div>

          <h2 class="text-xl md:text-2xl font-bold text-white tracking-tight leading-snug font-display">
            ${item.fullTitle}
          </h2>
        </div>

        <!-- 1. FACTS (BAR EXAM QUESTION STYLE) -->
        <div class="space-y-2">
          <div class="flex items-center space-x-2 text-amber-400 text-xs font-bold uppercase tracking-wider font-mono">
            <i data-lucide="clipboard-list" class="w-4 h-4"></i>
            <span>Relevant Facts (Bar Examination Style)</span>
          </div>
          <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 text-xs md:text-sm text-slate-300 leading-relaxed whitespace-pre-line shadow-inner">
            ${item.facts}
          </div>
        </div>

        <!-- 2. ISSUE (DIRECT QUESTION FORM) -->
        <div class="space-y-2">
          <div class="flex items-center space-x-2 text-rose-400 text-xs font-bold uppercase tracking-wider font-mono">
            <i data-lucide="help-circle" class="w-4 h-4"></i>
            <span>Issue</span>
          </div>
          <div class="bg-rose-950/20 border border-rose-900/40 rounded-xl p-4 text-xs md:text-sm font-semibold text-rose-200 leading-relaxed">
            ${item.issue}
          </div>
        </div>

        <!-- 3. PROVISIONS OF LAW RELIED UPON -->
        <div class="space-y-2">
          <div class="flex items-center space-x-2 text-sky-400 text-xs font-bold uppercase tracking-wider font-mono">
            <i data-lucide="book-marked" class="w-4 h-4"></i>
            <span>Provisions of Law and Rules Relied Upon</span>
          </div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1.5">
            ${item.provisions.map(p => `
              <div class="flex items-start space-x-2 text-xs text-sky-200">
                <i data-lucide="check" class="w-3.5 h-3.5 text-sky-400 mt-0.5 flex-shrink-0"></i>
                <span>${p}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- 4. VERBATIM SUPREME COURT LEGAL BASIS -->
        <div class="space-y-2">
          <div class="flex items-center space-x-2 text-amber-300 text-xs font-bold uppercase tracking-wider font-mono">
            <i data-lucide="quote" class="w-4 h-4"></i>
            <span>Verbatim Supreme Court Legal Basis</span>
          </div>
          <div class="bg-amber-950/10 border-l-4 border-amber-500 rounded-r-xl p-4 text-xs md:text-sm text-amber-100 font-serif italic leading-relaxed space-y-3">
            ${item.verbatimRuling.split('\n\n').map(q => `<p>${q}</p>`).join('')}
          </div>
        </div>

        <!-- 5. RATIO DECIDENDI -->
        <div class="space-y-2">
          <div class="flex items-center space-x-2 text-emerald-400 text-xs font-bold uppercase tracking-wider font-mono">
            <i data-lucide="brain-circuit" class="w-4 h-4"></i>
            <span>Ratio Decidendi</span>
          </div>
          <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 text-xs md:text-sm text-slate-300 leading-relaxed shadow-inner">
            ${item.ratio}
          </div>
        </div>

        <!-- 6. FALLO (DISPOSITIVE PORTION) -->
        <div class="space-y-2 pb-6">
          <div class="flex items-center space-x-2 text-violet-400 text-xs font-bold uppercase tracking-wider font-mono">
            <i data-lucide="gavel" class="w-4 h-4"></i>
            <span>Fallo (Dispositive Portion)</span>
          </div>
          <div class="bg-slate-900 border border-violet-900/40 rounded-xl p-4 text-xs md:text-sm font-mono text-violet-200 leading-relaxed shadow-sm">
            ${item.fallo}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // -------------------------------------------------------------
    // MASTER RENDER
    // -------------------------------------------------------------
    function renderActiveCase() {
      const activeItem = allCases[currentCaseIndex];
      renderSyllabusTree();
      renderInfographicPane(activeItem);
      renderDigestPane(activeItem);
    }

    // -------------------------------------------------------------
    // CONTROLS & EVENT LISTENERS
    // -------------------------------------------------------------

    // Next / Prev Case
    document.getElementById('next-case-btn').onclick = () => {
      currentCaseIndex = (currentCaseIndex + 1) % allCases.length;
      renderActiveCase();
    };

    document.getElementById('prev-case-btn').onclick = () => {
      currentCaseIndex = (currentCaseIndex - 1 + allCases.length) % allCases.length;
      renderActiveCase();
    };

    // Sidebar Toggle
    document.getElementById('toggle-sidebar-btn').onclick = () => {
      const sb = document.getElementById('syllabus-sidebar');
      sb.classList.toggle('-ml-72');
    };

    // Case Jump Select
    document.getElementById('case-jump-select').onchange = (e) => {
      const idx = allCases.findIndex(c => c.id === e.target.value);
      if (idx !== -1) {
        currentCaseIndex = idx;
        renderActiveCase();
      }
    };

    // Global Search
    document.getElementById('global-search').oninput = (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) return;
      const foundIdx = allCases.findIndex(c => 
        c.shortTitle.toLowerCase().includes(term) ||
        c.fullTitle.toLowerCase().includes(term) ||
        c.grNo.toLowerCase().includes(term) ||
        c.category.toLowerCase().includes(term) ||
        c.ratio.toLowerCase().includes(term) ||
        c.infographic.doctrineBox.toLowerCase().includes(term)
      );
      if (foundIdx !== -1) {
        currentCaseIndex = foundIdx;
        renderActiveCase();
      }
    };

    // Copy Ratio Button
    document.getElementById('copy-ratio-btn').onclick = () => {
      const activeItem = allCases[currentCaseIndex];
      const copyText = `RATIO DECIDENDI: ${activeItem.shortTitle} (${activeItem.grNo}):\n\n${activeItem.ratio}`;
      const textarea = document.createElement('textarea');
      textarea.value = copyText;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast("Ratio copied to clipboard!");
    };

    // Print
    document.getElementById('print-btn').onclick = () => {
      window.print();
    };

    // Font Toggle
    document.getElementById('toggle-font-btn').onclick = () => {
      isSerifFont = !isSerifFont;
      renderDigestPane(allCases[currentCaseIndex]);
      showToast(isSerifFont ? "Switched to Serif font" : "Switched to Sans font");
    };

    // Toast
    function showToast(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = text;
      toast.classList.remove('translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2200);
    }

    // Keyboard Shortcuts (Arrow Left/Right to flip cases)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowRight') {
        currentCaseIndex = (currentCaseIndex + 1) % allCases.length;
        renderActiveCase();
      } else if (e.key === 'ArrowLeft') {
        currentCaseIndex = (currentCaseIndex - 1 + allCases.length) % allCases.length;
        renderActiveCase();
      }
    });

    // Run on startup
    window.onload = () => {
      renderActiveCase();
    };
  </script>
</body>
</html>
