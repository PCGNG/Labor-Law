<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labor Law Reviewer | 3-Pane Syllabus View</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090e17;
      --bg-sidebar: #0d1420;
      --bg-middle: #101826;
      --bg-right: #131d2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
      --emerald-accent: #10b981;
      --sky-accent: #38bdf8;
      
      /* Infographic Pastel Tone Palette */
      --info-bg: #eceae3;
      --info-text: #1e293b;
      --info-card-facts: #e2ede5;
      --info-card-turning: #fde8e7;
      --info-card-issue: #fae0e4;
      --info-card-rationale: #f4ecdf;
      --info-card-doctrine: #daf0e4;
      --info-card-quote: #fdf5d6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP HEADER BAR */
    header.app-bar {
      height: 52px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
      z-index: 10;
    }

    .brand-block { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .badge-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
    }

    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .btn-secondary:hover { background: #334155; color: #fff; }
    .btn-primary { background: var(--gold-accent); color: #000; font-weight: 700; }
    .btn-primary:hover { background: #d97706; }
    .btn-emerald { background: #059669; color: #fff; }
    .btn-emerald:hover { background: #10b981; }

    /* 3-PANE WORKSPACE */
    .three-pane-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      width: 100vw;
    }

    /* PANE HEADER STRIPS */
    .pane-header-strip {
      height: 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(13, 20, 32, 0.85);
      flex-shrink: 0;
    }

    /* PANE 1: LEFT SYLLABUS TREE (Topics, Sub-topics & Cases) */
    .pane-left-tree {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tree-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }

    .topic-card {
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.015);
      border-radius: 8px;
      overflow: hidden;
    }

    .topic-title {
      padding: 8px 10px;
      background: rgba(30, 41, 59, 0.5);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtopic-item {
      padding: 7px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .subtopic-item:hover, .subtopic-item.active-subtopic {
      color: var(--sky-accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .case-sub-list {
      padding: 4px 6px 6px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 2px solid #1e293b;
      margin: 4px 0 6px 14px;
    }

    .case-node {
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.71rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .case-node:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .case-node.active-case {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-accent);
      font-weight: 700;
      border-left: 2px solid var(--gold-accent);
    }

    /* PANE 2: MIDDLE PANE (Topic & Sub-topic Overview) */
    .pane-middle-overview {
      flex: 1;
      background: var(--bg-middle);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .middle-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .infographic-sheet {
      width: 100%;
      max-width: 580px;
      background-color: var(--info-bg);
      color: var(--info-text);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: fit-content;
    }

    .info-header {
      border-bottom: 2px solid #ded9cb;
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.15;
      color: #111827;
      text-transform: uppercase;
    }

    .info-subhead { font-size: 0.73rem; color: #64748b; font-weight: 600; margin-top: 4px; }
    .info-badge-stamp { text-align: right; flex-shrink: 0; }
    .info-badge-stamp .tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #475569;
      display: block;
    }
    .info-badge-stamp .sub-tag { font-size: 0.62rem; font-weight: 700; color: #94a3b8; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-card {
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-card.card-facts { background-color: var(--info-card-facts); }
    .info-card.card-turning { background-color: var(--info-card-turning); }
    .info-card.card-issue { background-color: var(--info-card-issue); }
    .info-card.card-rationale { background-color: var(--info-card-rationale); }
    .info-card.card-doctrine { background-color: var(--info-card-doctrine); }
    .info-card.card-quote { background-color: var(--info-card-quote); }

    .info-card-title {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-card p { font-size: 0.74rem; line-height: 1.45; color: #1e293b; }

    /* PANE 3: RIGHT PANE (Full Bar Exam Case Digest) */
    .pane-right-digest {
      flex: 1.25;
      background: var(--bg-right);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .digest-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }

    .digest-meta-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .digest-case-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 6px;
    }

    .digest-citation {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: #94a3b8;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .digest-section { margin-bottom: 20px; }
    .section-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label.facts-label { color: #fbbf24; }
    .section-label.issue-label { color: #38bdf8; }
    .section-label.rules-label { color: #a78bfa; }
    .section-label.ruling-label { color: #34d399; }
    .section-label.ratio-label { color: #f472b6; }
    .section-label.fallo-label { color: #f87171; }

    .digest-text-content {
      font-size: 0.85rem;
      line-height: 1.65;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
    }

    .verbatim-box {
      font-style: italic;
      border-left: 3px solid #34d399;
      background: rgba(5, 150, 105, 0.08);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      color: #e2e8f0;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .fallo-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      line-height: 1.5;
      color: #fca5a5;
    }

    /* SCROLLBARS */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #263346; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4d66; }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="app-bar">
    <div class="brand-block">
      <span class="brand-title">⚖ Labor Law Reviewer</span>
      <span class="badge-pill">3-Pane Syllabus View</span>
    </div>

    <div class="nav-actions">
      <button class="btn btn-secondary" onclick="exportDataJSON()">Export JSON</button>
      <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
    </div>
  </header>

  <!-- 3-PANE WORKSPACE -->
  <main class="three-pane-container">
    
    <!-- PANE 1: LEFT SYLLABUS TREE -->
    <aside class="pane-left-tree">
      <div class="pane-header-strip">
        <span>📁 Syllabus Hierarchy</span>

      </div>
      <div class="tree-scroll-area" id="syllabusTreeContainer"></div>

        <span id="middleTag" style="color: var(--gold-accent);">Doctrine Focus</span>
      </div>
      <div class="middle-scroll-area">
        <div class="infographic-sheet" id="overviewCanvas"></div>
      </div>
    </section>

    <!-- PANE 3: RIGHT CASE BRIEF -->
    <section class="pane-right-digest">
      <div class="pane-header-strip">
        <span>⚖ Bar Exam Case Digest</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.65rem;" onclick="copyRatio()">Copy Ratio</button>
        </div>
      </div>
      <div class="digest-scroll-area" id="digestCanvas"></div>
    </section>

  </main>

    let syllabusData = DEFAULT_SYLLABUS;
    let selectedIndex = 0;

    // Load data from external cases.json if available, else keep default
    fetch('cases.json')
      .then(res => {
        if (!res.ok) throw new Error("cases.json not found, using embedded default syllabus.");
        return res.json();
      })
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          syllabusData = data;
        }
        renderApp();
      })
      .catch(err => {
        console.log(err.message);
        renderApp();
      });

    function renderApp() {
      renderLeftTree();
      renderMiddleOverview();
      renderRightDigest();
    }

    /* PANE 1: LEFT SYLLABUS TREE */
    function renderLeftTree() {
      const tree = document.getElementById('syllabusTreeContainer');
      document.getElementById('caseCountBadge').textContent = `${syllabusData.length} Entries`;

      // Group by Topic -> Sub-topic
      const structure = {};
      syllabusData.forEach((item, idx) => {
        if (!structure[item.topic]) structure[item.topic] = {};
        if (!structure[item.topic][item.subtopic]) structure[item.topic][item.subtopic] = [];
        structure[item.topic][item.subtopic].push({ entry: item, index: idx });
      });

      let html = '';
      for (const [topicName, subtopics] of Object.entries(structure)) {
        html += `
          <div class="topic-card">
            <div class="topic-title">
              <span>📁</span>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${topicName}</span>
            </div>
        `;

        for (const [subtopicName, entries] of Object.entries(subtopics)) {
          const isSubActive = entries.some(e => e.index === selectedIndex);
          const hasMultipleCases = entries.length > 1 || !entries[0].id.startsWith('slu-subtopic');

          html += `
            <div class="subtopic-item ${isSubActive ? 'active-subtopic' : ''}" onclick="selectCase(${entries[0].index})">
              <span>• ${subtopicName}</span>
              ${hasMultipleCases ? `<span style="font-size: 0.65rem; color: #64748b;">${entries.length} cases</span>` : ''}
            </div>
          `;

          // If sub-topic contains actual cases, list them underneath
          if (hasMultipleCases) {
            html += `<div class="case-sub-list">`;
            entries.forEach(e => {
              const isCaseActive = e.index === selectedIndex;
              const shortName = e.entry.caseDigest.title.split(/v\.|vs\./i)[0].trim();
              html += `
                <div class="case-node ${isCaseActive ? 'active-case' : ''}" onclick="selectCase(${e.index})">
                  ⚖ ${shortName}
                </div>
              `;
            });
            html += `</div>`;
          }
        }

        html += `</div>`;
      }

      tree.innerHTML = html;
    }

    /* PANE 2: MIDDLE OVERVIEW */
    function renderMiddleOverview() {
      const canvas = document.getElementById('overviewCanvas');
      if (syllabusData.length === 0) return;

      const item = syllabusData[selectedIndex];
      document.getElementById('middleTag').textContent = `${item.subtopic}`;

      canvas.innerHTML = `
        <div class="info-header">
          <div>
            <h1 class="info-title">${item.overview.title}</h1>
            <div class="info-subhead">${item.caseDigest.citation}</div>
          </div>
          <div class="info-badge-stamp">
            <span class="tag">${item.overview.badge}</span>
            <span class="sub-tag">${item.overview.legalBasis}</span>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-facts">
            <div class="info-card-title">📅 FACTS / SCOPE</div>
            <p>${item.overview.factsSummary}</p>
          </div>
          <div class="info-card card-rationale">
            <div class="info-card-title">⚖ RATIONALE</div>
            <p>${item.overview.rationale}</p>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-turning">
            <div class="info-card-title">⚡ TURNING POINT / TRIGGER</div>
            <p>${item.overview.turningPoint}</p>
          </div>
          <div class="info-card card-doctrine">
            <div class="info-card-title">🛡 DOCTRINE</div>
            <p>${item.overview.doctrine}</p>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-issue">
            <div class="info-card-title">❓ CORE ISSUE</div>
            <p><strong>${item.overview.issueQuestion}</strong></p>
          </div>
          <div class="info-card card-quote">
            <div class="info-card-title">💡 KEY TAKEAWAY</div>
            <p style="font-weight: 700;">"${item.overview.takeawayQuote}"</p>
          </div>
        </div>
      `;
    }

    /* PANE 3: RIGHT CASE BRIEF */
    function renderRightDigest() {
      const canvas = document.getElementById('digestCanvas');
      if (syllabusData.length === 0) return;

      const item = syllabusData[selectedIndex];

      canvas.innerHTML = `
        <div class="digest-meta-tag">${item.topic} › ${item.subtopic}</div>
        <h2 class="digest-case-heading">${item.caseDigest.title}</h2>
        <div class="digest-citation">${item.caseDigest.citation}</div>

        <div class="digest-section">
          <div class="section-label facts-label">📋 RELEVANT FACTS (BAR EXAMINATION STYLE)</div>
          <div class="digest-text-content">${item.caseDigest.facts}</div>
        </div>

        <div class="digest-section">
          <div class="section-label issue-label">❓ ISSUE</div>
          <div class="digest-text-content"><strong>${item.caseDigest.issue}</strong></div>
        </div>

        <div class="digest-section">
          <div class="section-label rules-label">📖 PROVISIONS OF LAW AND RULES RELIED UPON</div>
          <div class="digest-text-content">${item.caseDigest.provisions}</div>
        </div>

        <div class="digest-section">
          <div class="section-label ruling-label">⚖ VERBATIM SUPREME COURT LEGAL BASIS</div>
          <div class="verbatim-box">${item.caseDigest.verbatimRuling}</div>
        </div>

        <div class="digest-section">
          <div class="section-label ratio-label">🧠 RATIO DECIDENDI</div>
          <div class="digest-text-content" id="activeRatioText">${item.caseDigest.ratioDecidendi}</div>
        </div>

        <div class="digest-section">
          <div class="section-label fallo-label">📜 FALLO (DISPOSITIVE PORTION)</div>
          <div class="fallo-box">${item.caseDigest.fallo}</div>
        </div>
      `;
    }

    function selectCase(index) {
      selectedIndex = index;
      renderApp();
    }

    function copyRatio() {
      const txt = document.getElementById('activeRatioText')?.innerText;
      if (txt) {
        navigator.clipboard.writeText(txt).then(() => alert("Ratio Decidendi copied!"));
      }
    }

    function exportDataJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(syllabusData, null, 2));
      const dl = document.createElement('a');
      dl.setAttribute("href", dataStr);
      dl.setAttribute("download", "cases.json");
      document.body.appendChild(dl);
      dl.click();
      dl.remove();
    }

    // Initial render
    renderApp();
  </script>
