<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labor Law Case Digests | PCGNG</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- PDF.js Engine for Client-Side PDF Text Extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0d121c;
      --bg-sidebar: #090e17;
      --panel-dark: #121927;
      --border-dark: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
      --emerald-accent: #10b981;
      
      /* Visual Infographic Pastel Tone Palette */
      --info-bg: #eceae3;
      --info-text: #1e293b;
      --info-card-facts: #e2ede5;
      --info-card-turning: #fde8e7;
      --info-card-issue: #fae0e4;
      --info-card-rationale: #f4ecdf;
      --info-card-doctrine: #daf0e4;
      --info-card-quote: #fdf5d6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header.app-bar {
      height: 52px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand-block { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .badge-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
    }

    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .btn-secondary:hover { background: #334155; color: #fff; }
    .btn-primary { background: var(--gold-accent); color: #000; }
    .btn-primary:hover { background: #d97706; }
    .btn-emerald { background: #059669; color: #fff; }
    .btn-emerald:hover { background: #10b981; }

    .select-dropdown {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      max-width: 280px;
      outline: none;
    }

    .workspace { flex: 1; display: flex; overflow: hidden; }

    /* SYLLABUS TREE NAVIGATION */
    .syllabus-sidebar {
      width: 290px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1420;
    }

    .sidebar-head h4 {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }

    .tree-scroll-container { flex: 1; overflow-y: auto; padding: 10px 8px; }

    .topic-group { margin-bottom: 12px; }
    .topic-title-bar {
      padding: 6px 8px;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtopic-group {
      margin-left: 10px;
      margin-top: 4px;
      border-left: 1.5px solid #1e293b;
      padding-left: 8px;
    }

    .subtopic-title-bar {
      font-size: 0.7rem;
      font-weight: 600;
      color: #94a3b8;
      padding: 4px 6px;
    }

    .case-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      margin-top: 2px;
      border-radius: 5px;
      font-size: 0.72rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.15s;
    }

    .case-nav-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .case-nav-item.active {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-accent);
      font-weight: 700;
      border-left: 2px solid var(--gold-accent);
    }

    /* PANES */
    .content-panes-wrapper { flex: 1; display: flex; overflow: hidden; }

    .pane-header-strip {
      height: 38px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #0e1624;
    }

    /* LEFT INFOGRAPHIC PANE */
    .pane-left-infographic {
      flex: 1;
      background: #0f172a;
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .infographic-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #111a2e;
      display: flex;
      justify-content: center;
    }

    .infographic-sheet {
      width: 100%;
      max-width: 580px;
      background-color: var(--info-bg);
      color: var(--info-text);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-header {
      border-bottom: 2px solid #ded9cb;
      padding-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.15;
      color: #111827;
      text-transform: uppercase;
    }

    .info-subhead { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-top: 4px; }
    .info-badge-stamp { text-align: right; flex-shrink: 0; }
    .info-badge-stamp .tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #475569;
      display: block;
    }
    .info-badge-stamp .sub-tag { font-size: 0.62rem; font-weight: 700; color: #94a3b8; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .info-card {
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-card.card-facts { background-color: var(--info-card-facts); }
    .info-card.card-turning { background-color: var(--info-card-turning); }
    .info-card.card-issue { background-color: var(--info-card-issue); }
    .info-card.card-rationale { background-color: var(--info-card-rationale); }
    .info-card.card-doctrine { background-color: var(--info-card-doctrine); }
    .info-card.card-quote { background-color: var(--info-card-quote); }

    .info-card-title {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-card p { font-size: 0.75rem; line-height: 1.45; color: #1e293b; }

    /* RIGHT DIGEST PANE */
    .pane-right-digest {
      flex: 1.15;
      background: var(--panel-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .digest-viewport { flex: 1; overflow-y: auto; padding: 24px 30px; }
    .digest-meta-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .digest-case-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 6px;
    }

    .digest-citation {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dark);
    }

    .digest-section { margin-bottom: 22px; }
    .section-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label.facts-label { color: #fbbf24; }
    .section-label.issue-label { color: #38bdf8; }
    .section-label.rules-label { color: #a78bfa; }
    .section-label.ruling-label { color: #34d399; }
    .section-label.ratio-label { color: #f472b6; }
    .section-label.fallo-label { color: #f87171; }

    .digest-text-content {
      font-size: 0.86rem;
      line-height: 1.65;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 16px;
      border-radius: 8px;
    }

    .verbatim-box {
      font-style: italic;
      border-left: 3px solid #34d399;
      background: rgba(5, 150, 105, 0.08);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      color: #e2e8f0;
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .fallo-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #fca5a5;
    }

    /* HIDDEN FILE INPUT */
    #pdfFileInput { display: none; }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="app-bar">
    <div class="brand-block">
      <span class="brand-title">⚖ Labor Law Case Digests</span>
      <span class="badge-pill">Bar Exam Reviewer</span>
    </div>

    <div class="nav-actions">
      <button class="btn btn-secondary" onclick="prevCase()">❮ Prev</button>
      <select id="quickJumpSelect" class="select-dropdown" onchange="jumpToCase(this.value)"></select>
      <button class="btn btn-secondary" onclick="nextCase()">Next ❯</button>
      
      <!-- AUTOMATIC PDF IMPORT BUTTON -->
      <button class="btn btn-emerald" onclick="document.getElementById('pdfFileInput').click()">📄 Upload PDF Syllabus</button>
      <input type="file" id="pdfFileInput" accept="application/pdf" onchange="handlePDFUpload(event)">
      
      <button class="btn btn-secondary" onclick="clearAllData()">Reset</button>
      <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="workspace">
    <!-- SYLLABUS NAVIGATOR -->
    <aside class="syllabus-sidebar">
      <div class="sidebar-head">
        <h4>Syllabus Navigator</h4>
        <span id="caseCountBadge" class="badge-pill">0 Cases</span>
      </div>
      <div class="tree-scroll-container" id="treeContainer"></div>
    </aside>

    <!-- CONTENT PANES -->
    <div class="content-panes-wrapper">
      <!-- LEFT PANE: INFOGRAPHIC CARDS -->
      <section class="pane-left-infographic">
        <div class="pane-header-strip">
          <span>● Visual Infographic Overview</span>
          <span id="leftPaneSubtopicTag" style="color: var(--gold-accent);">Topic Overview</span>
        </div>
        <div class="infographic-viewport">
          <div class="infographic-sheet" id="infographicContent"></div>
        </div>
      </section>

      <!-- RIGHT PANE: BAR CASE DIGEST -->
      <section class="pane-right-digest">
        <div class="pane-header-strip">
          <span>⚖ Bar Exam Case Digest & Ruling</span>
          <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.68rem;" onclick="copyRatioDecidendi()">Copy Ratio</button>
        </div>
        <div class="digest-viewport" id="digestContent"></div>
      </section>
    </div>
  </main>

  <script>
    // PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let cases = JSON.parse(localStorage.getItem('LABOR_LAW_PARSED_DATA')) || [];
    let currentCaseIndex = 0;

    // Load initial empty or parsed state
    function saveAndRender() {
      localStorage.setItem('LABOR_LAW_PARSED_DATA', JSON.stringify(cases));
      renderSidebar();
      renderQuickJump();
      renderCurrentCase();
    }

    function renderSidebar() {
      const treeContainer = document.getElementById('treeContainer');
      document.getElementById('caseCountBadge').textContent = `${cases.length} Case${cases.length === 1 ? '' : 's'}`;

      if (cases.length === 0) {
        treeContainer.innerHTML = '<div style="padding: 20px; font-size: 0.72rem; color: #64748b; text-align: center;">Upload your syllabus PDF using the top button to automatically populate topics and cases.</div>';
        return;
      }

      const grouped = {};
      cases.forEach((item, index) => {
        if (!grouped[item.topic]) grouped[item.topic] = {};
        if (!grouped[item.topic][item.subtopic]) grouped[item.topic][item.subtopic] = [];
        grouped[item.topic][item.subtopic].push({ ...item, globalIndex: index });
      });

      let html = '';
      for (const [topic, subtopics] of Object.entries(grouped)) {
        html += `
          <div class="topic-group">
            <div class="topic-title-bar">
              <span>📁</span>
              <span>${topic}</span>
            </div>
        `;
        for (const [subtopic, caseList] of Object.entries(subtopics)) {
          html += `
            <div class="subtopic-group">
              <div class="subtopic-title-bar">• ${subtopic}</div>
          `;
          caseList.forEach(c => {
            const activeCls = c.globalIndex === currentCaseIndex ? 'active' : '';
            html += `
              <div class="case-nav-item ${activeCls}" onclick="selectCase(${c.globalIndex})">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">📄 ${c.caseDigest.title.split('v.')[0]}</span>
              </div>
            `;
          });
          html += `</div>`;
        }
        html += `</div>`;
      }
      treeContainer.innerHTML = html;
    }

    function renderQuickJump() {
      const select = document.getElementById('quickJumpSelect');
      if (cases.length === 0) {
        select.innerHTML = '<option>No cases loaded</option>';
        return;
      }
      select.innerHTML = cases.map((c, i) => `
        <option value="${i}" ${i === currentCaseIndex ? 'selected' : ''}>
          ${c.subtopic}: ${c.caseDigest.title.substring(0, 32)}...
        </option>
      `).join('');
    }

    function renderCurrentCase() {
      if (cases.length === 0) {
        document.getElementById('infographicContent').innerHTML = `
          <div style="text-align: center; padding: 40px 20px;">
            <h2 style="font-size: 1.2rem; color: #475569; margin-bottom: 8px;">No Syllabus Loaded</h2>
            <p style="font-size: 0.8rem; color: #64748b;">Click <strong>"📄 Upload PDF Syllabus"</strong> above to extract all topics, sub-topics, and case briefs directly from your document.</p>
          </div>
        `;
        document.getElementById('digestContent').innerHTML = `
          <div style="text-align: center; padding: 40px 20px; color: #64748b; font-size: 0.85rem;">
            Awaiting PDF extraction...
          </div>
        `;
        return;
      }

      const item = cases[currentCaseIndex];
      document.getElementById('leftPaneSubtopicTag').textContent = `${item.topic} › ${item.subtopic}`;

      document.getElementById('infographicContent').innerHTML = `
        <div class="info-header">
          <div>
            <h1 class="info-title">${item.overview.title}</h1>
            <div class="info-subhead">${item.caseDigest.citation}</div>
          </div>
          <div class="info-badge-stamp">
            <span class="tag">${item.overview.badge}</span>
            <span class="sub-tag">${item.overview.legalBasis}</span>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-facts">
            <div class="info-card-title">📅 FACTS</div>
            <p>${item.overview.factsSummary}</p>
          </div>
          <div class="info-card card-rationale">
            <div class="info-card-title">⚖ RATIONALE</div>
            <p>${item.overview.rationale}</p>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-turning">
            <div class="info-card-title">⚡ TURNING POINT</div>
            <p>${item.overview.turningPoint}</p>
          </div>
          <div class="info-card card-doctrine">
            <div class="info-card-title">🛡 DOCTRINE</div>
            <p>${item.overview.doctrine}</p>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card card-issue">
            <div class="info-card-title">❓ ISSUE</div>
            <p><strong>${item.overview.issueQuestion}</strong></p>
          </div>
          <div class="info-card card-quote">
            <div class="info-card-title">💡 KEY TAKEAWAY</div>
            <p style="font-weight: 700;">"${item.overview.takeawayQuote}"</p>
          </div>
        </div>
      `;

      document.getElementById('digestContent').innerHTML = `
        <div class="digest-meta-tag">${item.topic} › ${item.subtopic}</div>
        <h2 class="digest-case-heading">${item.caseDigest.title}</h2>
        <div class="digest-citation">${item.caseDigest.citation}</div>

        <div class="digest-section">
          <div class="section-label facts-label">📋 RELEVANT FACTS (BAR EXAMINATION STYLE)</div>
          <div class="digest-text-content">${item.caseDigest.facts}</div>
        </div>

        <div class="digest-section">
          <div class="section-label issue-label">❓ ISSUE</div>
          <div class="digest-text-content"><strong>${item.caseDigest.issue}</strong></div>
        </div>

        <div class="digest-section">
          <div class="section-label rules-label">📖 PROVISIONS OF LAW AND RULES RELIED UPON</div>
          <div class="digest-text-content">${item.caseDigest.provisions}</div>
        </div>

        <div class="digest-section">
          <div class="section-label ruling-label">⚖ VERBATIM SUPREME COURT LEGAL BASIS</div>
          <div class="verbatim-box">${item.caseDigest.verbatimRuling}</div>
        </div>

        <div class="digest-section">
          <div class="section-label ratio-label">🧠 RATIO DECIDENDI</div>
          <div class="digest-text-content" id="currentRatioText">${item.caseDigest.ratioDecidendi}</div>
        </div>

        <div class="digest-section">
          <div class="section-label fallo-label">📜 FALLO (DISPOSITIVE PORTION)</div>
          <div class="fallo-box">${item.caseDigest.fallo}</div>
        </div>
      `;
    }

    function selectCase(index) {
      currentCaseIndex = index;
      renderSidebar();
      renderQuickJump();
      renderCurrentCase();
    }

    function prevCase() {
      if (currentCaseIndex > 0) selectCase(currentCaseIndex - 1);
    }

    function nextCase() {
      if (currentCaseIndex < cases.length - 1) selectCase(currentCaseIndex + 1);
    }

    function jumpToCase(index) {
      selectCase(parseInt(index));
    }

    function copyRatioDecidendi() {
      const ratio = document.getElementById('currentRatioText')?.innerText;
      if (ratio) {
        navigator.clipboard.writeText(ratio).then(() => alert('Ratio copied!'));
      }
    }

    function clearAllData() {
      if (confirm('Reset syllabus and remove all loaded cases?')) {
        localStorage.removeItem('LABOR_LAW_PARSED_DATA');
        cases = [];
        currentCaseIndex = 0;
        saveAndRender();
      }
    }

    /* ==========================================
       PDF EXTRACTION & INTELLIGENT PARSER ENGINE
       ========================================== */
    async function handlePDFUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      alert("Extracting text from PDF. Please allow a few moments...");

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageStr = textContent.items.map(item => item.str).join(' ');
          fullText += pageStr + '\n\n';
        }

        // Parse extracted full text into structured cases
        const parsedCases = parseSyllabusText(fullText);

        if (parsedCases.length === 0) {
          alert("Could not automatically locate case digest markers in this PDF. Please verify your document contains headings like FACTS, ISSUE, and HELD.");
          return;
        }

        cases = parsedCases;
        currentCaseIndex = 0;
        saveAndRender();
        alert(`Successfully imported ${cases.length} cases from your PDF!`);
      } catch (err) {
        console.error(err);
        alert("An error occurred while reading the PDF: " + err.message);
      }
    }

    function parseSyllabusText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const parsed = [];

      let currentTopic = "General Labor Law";
      let currentSubtopic = "General Principles";

      // Regex patterns
      const topicRegex = /^(?:TOPIC\s*\d*|BOOK\s+[IVXLCDM]+|PART\s+[A-Z0-9]+|[IVXLCDM]+\.)\s*(.*)/i;
      const subtopicRegex = /^(?:[A-Z]\.|\d+\.)\s*(.*)/;
      const caseTitleRegex = /([A-Z][A-Za-z\s,\.\-&]+(?:v\.|vs\.|V\.)[A-Za-z\s,\.\-&]+)/;

      let currentBlock = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Check for Topic
        if (topicRegex.test(line) && line.length < 90) {
          currentTopic = line;
          continue;
        }

        // Check for Subtopic
        if (subtopicRegex.test(line) && line.length < 90 && !line.includes('v.') && !line.includes('vs.')) {
          currentSubtopic = line;
          continue;
        }

        // Check for Case Heading
        if ((line.includes('v.') || line.includes('vs.') || line.includes('G.R. No.')) && line.length < 150) {
          if (currentBlock) {
            finalizeCase(currentBlock, parsed);
          }
          currentBlock = {
            topic: currentTopic,
            subtopic: currentSubtopic,
            rawTitle: line,
            citation: lines[i+1]?.includes('G.R.') ? lines[++i] : 'Supreme Court Jurisprudence',
            facts: '',
            issue: '',
            ruling: '',
            fallo: '',
            section: 'facts'
          };
          continue;
        }

        if (!currentBlock) continue;

        // Detect internal digest sections
        if (/^FACTS/i.test(line)) {
          currentBlock.section = 'facts';
          continue;
        } else if (/^ISSUE/i.test(line)) {
          currentBlock.section = 'issue';
          continue;
        } else if (/^(?:HELD|RULING|RATIO|RATIO DECIDENDI)/i.test(line)) {
          currentBlock.section = 'ruling';
          continue;
        } else if (/^(?:FALLO|WHEREFORE|DISPOSITIVE)/i.test(line)) {
          currentBlock.section = 'fallo';
          continue;
        }

        // Append line text to active section
        if (currentBlock.section === 'facts') currentBlock.facts += ' ' + line;
        else if (currentBlock.section === 'issue') currentBlock.issue += ' ' + line;
        else if (currentBlock.section === 'ruling') currentBlock.ruling += ' ' + line;
        else if (currentBlock.section === 'fallo') currentBlock.fallo += ' ' + line;
      }

      if (currentBlock) {
        finalizeCase(currentBlock, parsed);
      }

      return parsed;
    }

    function finalizeCase(block, list) {
      const title = block.rawTitle || 'Untitled Case';
      const shortTitle = title.split(/v\.|vs\./i)[0].trim();
      const facts = block.facts.trim() || 'No facts provided.';
      const issue = block.issue.trim() || 'Core legal issue.';
      const ruling = block.ruling.trim() || 'Ruling not specified.';
      const fallo = block.fallo.trim() || 'WHEREFORE, judgment rendered accordingly.';

      list.push({
        id: 'case-' + Math.random().toString(36).substr(2, 9),
        topic: block.topic,
        subtopic: block.subtopic,
        overview: {
          badge: "LABOR DOCTRINE",
          title: shortTitle,
          legalBasis: "Labor Code of the Philippines",
          factsSummary: facts.length > 220 ? facts.substring(0, 220) + '...' : facts,
          turningPoint: "Crucial dispute or violation arising between the parties.",
          issueQuestion: issue.length > 120 ? issue.substring(0, 120) + '?' : issue,
          rationale: ruling.length > 220 ? ruling.substring(0, 220) + '...' : ruling,
          doctrine: ruling.length > 140 ? ruling.substring(0, 140) + '...' : ruling,
          takeawayQuote: "Controlling principle for bar examination review."
        },
        caseDigest: {
          title: title,
          citation: block.citation,
          facts: facts,
          issue: issue,
          provisions: "Applicable Labor Code Provisions and Implementing Rules",
          verbatimRuling: ruling.length > 280 ? ruling.substring(0, 280) + '...' : ruling,
          ratioDecidendi: ruling,
          fallo: fallo
        }
      });
    }

    // Init
    saveAndRender();
  </script>
