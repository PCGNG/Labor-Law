<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labor Law Reviewer | 3-Pane Syllabus View</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090e17;
      --bg-sidebar: #0d1420;
      --bg-middle: #101826;
      --bg-right: #131d2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
      --emerald-accent: #10b981;
      --sky-accent: #38bdf8;
      
      --info-bg: #eceae3;
      --info-text: #1e293b;
      --info-card-facts: #e2ede5;
      --info-card-turning: #fde8e7;
      --info-card-issue: #fae0e4;
      --info-card-rationale: #f4ecdf;
      --info-card-doctrine: #daf0e4;
      --info-card-quote: #fdf5d6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP HEADER BAR */
    header.app-bar {
      height: 52px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
      z-index: 10;
    }

    .brand-block { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .badge-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
    }

    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .btn-secondary:hover { background: #334155; color: #fff; }
    .btn-primary { background: var(--gold-accent); color: #000; font-weight: 700; }
    .btn-primary:hover { background: #d97706; }

    /* 3-PANE WORKSPACE */
    .three-pane-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      width: 100vw;
    }

    .pane-header-strip {
      height: 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(13, 20, 32, 0.85);
      flex-shrink: 0;
    }

    /* PANE 1: LEFT SYLLABUS TREE */
    .pane-left-tree {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tree-scroll-area { flex: 1; overflow-y: auto; padding: 12px 10px; }

    .topic-card {
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.015);
      border-radius: 8px;
      overflow: hidden;
    }

    .topic-title {
      padding: 8px 10px;
      background: rgba(30, 41, 59, 0.5);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtopic-item {
      padding: 7px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .subtopic-item:hover, .subtopic-item.active-subtopic {
      color: var(--sky-accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .case-sub-list {
      padding: 4px 6px 6px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 2px solid #1e293b;
      margin: 4px 0 6px 14px;
    }

    .case-node {
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.71rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .case-node:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .case-node.active-case {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-accent);
      font-weight: 700;
      border-left: 2px solid var(--gold-accent);
    }

    /* PANE 2: MIDDLE INFOGRAPHIC */
    .pane-middle-overview {
      flex: 1;
      background: var(--bg-middle);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .middle-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .infographic-sheet {
      width: 100%;
      max-width: 580px;
      background-color: var(--info-bg);
      color: var(--info-text);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: fit-content;
    }

    .info-header {
      border-bottom: 2px solid #ded9cb;
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 80
