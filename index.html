<script>
  let syllabusData = [];
  let selectedIndex = 0;
  const fileCache = {};

  // Fetch cases.json with cache buster
  fetch('cases.json?t=' + Date.now())
    .then(res => {
      if (!res.ok) throw new Error("cases.json returned status " + res.status);
      return res.json();
    })
    .then(data => {
      syllabusData = data;
      renderApp();
    })
    .catch(err => {
      console.error(err);
      document.getElementById('overviewCanvas').innerHTML = `
        <div style="padding: 24px; text-align: center; color: #ef4444; font-family: sans-serif;">
          <h3 style="font-size: 1.1rem; margin-bottom: 8px;">Failed to load cases.json</h3>
          <p style="font-size: 0.8rem; color: #94a3b8;">${err.message}</p>
        </div>
      `;
    });

  function renderApp() {
    renderLeftTree();
    renderMiddleOverview();
    renderRightDigest();
  }

  function renderLeftTree() {
    const tree = document.getElementById('syllabusTreeContainer');
    document.getElementById('caseCountBadge').textContent = `${syllabusData.length} Entries`;

    const structure = {};
    syllabusData.forEach((item, idx) => {
      if (!structure[item.topic]) structure[item.topic] = {};
      if (!structure[item.topic][item.subtopic]) structure[item.topic][item.subtopic] = [];
      structure[item.topic][item.subtopic].push({ entry: item, index: idx });
    });

    let html = '';
    for (const [topicName, subtopics] of Object.entries(structure)) {
      html += `
        <div class="topic-card">
          <div class="topic-title">
            <span>📁</span>
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${topicName}</span>
          </div>
      `;

      for (const [subtopicName, entries] of Object.entries(subtopics)) {
        const isSubActive = entries.some(e => e.index === selectedIndex);
        const hasMultiple = entries.length > 1 || !entries[0].id.startsWith('slu-subtopic');

        html += `
          <div class="subtopic-item ${isSubActive ? 'active-subtopic' : ''}" onclick="selectCase(${entries[0].index})">
            <span>• ${subtopicName}</span>
            ${hasMultiple ? `<span style="font-size: 0.62rem; color: #64748b;">${entries.length}</span>` : ''}
          </div>
        `;

        if (hasMultiple) {
          html += `<div class="case-sub-list">`;
          entries.forEach(e => {
            const isCaseActive = e.index === selectedIndex;
            const displayName = e.entry.id.replace(/-/g, ' ');
            html += `
              <div class="case-node ${isCaseActive ? 'active-case' : ''}" onclick="selectCase(${e.index})">
                ⚖ ${displayName}
              </div>
            `;
          });
          html += `</div>`;
        }
      }
      html += `</div>`;
    }
    tree.innerHTML = html;
  }

  async function fetchTextFile(path) {
    if (!path) return '';
    if (fileCache[path]) return fileCache[path];
    
    // encodeURI handles spaces in folder/file names properly
    const res = await fetch(encodeURI(path) + '?t=' + Date.now());
    if (!res.ok) throw new Error(`Could not find "${path}" (Status: ${res.status})`);
    const text = await res.text();
    fileCache[path] = text;
    return text;
  }

  function extractSection(rawText, key) {
    const regex = new RegExp(`^${key}:\\s*([\\s\\S]*?)(?=\\n[A-Z_]+:|$)`, 'm');
    const match = rawText.match(regex);
    return match ? match[1].trim() : '';
  }

  async function renderMiddleOverview() {
    const canvas = document.getElementById('overviewCanvas');
    if (syllabusData.length === 0) return;

    const item = syllabusData[selectedIndex];
    document.getElementById('middleTag').textContent = `${item.subtopic}`;

    if (item.overviewFile) {
      canvas.innerHTML = '<div style="padding: 24px; text-align: center; color: #64748b;">Loading overview...</div>';
      try {
        const text = await fetchTextFile(item.overviewFile);
        const title = extractSection(text, 'TITLE') || item.subtopic;
        const badge = extractSection(text, 'BADGE') || 'LABOR DOCTRINE';
        const legalBasis = extractSection(text, 'LEGAL_BASIS') || 'Labor Code of the Philippines';
        const facts = extractSection(text, 'FACTS') || 'No facts section found.';
        const turning = extractSection(text, 'TURNING_POINT') || 'Not specified.';
        const issue = extractSection(text, 'ISSUE') || 'Core legal issue.';
        const rationale = extractSection(text, 'RATIONALE') || 'Ruling rationale.';
        const doctrine = extractSection(text, 'DOCTRINE') || 'Key doctrine.';
        const takeaway = extractSection(text, 'TAKEAWAY') || 'Key takeaway.';

        canvas.innerHTML = `
          <div class="info-header">
            <div><h1 class="info-title">${title}</h1></div>
            <div class="info-badge-stamp">
              <span class="tag">${badge}</span>
              <span class="sub-tag">${legalBasis}</span>
            </div>
          </div>
          <div class="info-grid">
            <div class="info-card card-facts"><div class="info-card-title">📅 FACTS / SCOPE</div><p>${facts}</p></div>
            <div class="info-card card-rationale"><div class="info-card-title">⚖ RATIONALE</div><p>${rationale}</p></div>
          </div>
          <div class="info-grid">
            <div class="info-card card-turning"><div class="info-card-title">⚡ TURNING POINT</div><p>${turning}</p></div>
            <div class="info-card card-doctrine"><div class="info-card-title">🛡 DOCTRINE</div><p>${doctrine}</p></div>
          </div>
          <div class="info-grid">
            <div class="info-card card-issue"><div class="info-card-title">❓ CORE ISSUE</div><p><strong>${issue}</strong></p></div>
            <div class="info-card card-quote"><div class="info-card-title">💡 KEY TAKEAWAY</div><p style="font-weight: 700;">${takeaway}</p></div>
          </div>
        `;
      } catch (err) {
        canvas.innerHTML = `
          <div style="padding: 20px; color: #ef4444; font-size: 0.82rem; line-height: 1.5;">
            <strong>Error loading overview file:</strong><br>
            <code>${err.message}</code><br><br>
            <span style="color: #64748b;">Make sure the file path inside <code>cases.json</code> matches your GitHub file name and folder capitalization exactly.</span>
          </div>
        `;
      }
    }
  }

  async function renderRightDigest() {
    const canvas = document.getElementById('digestCanvas');
    if (syllabusData.length === 0) return;

    const item = syllabusData[selectedIndex];

    if (item.digestFile) {
      canvas.innerHTML = '<div style="padding: 24px; text-align: center; color: #64748b;">Loading case brief...</div>';
      try {
        const text = await fetchTextFile(item.digestFile);
        const title = extractSection(text, 'TITLE') || 'Case Brief';
        const citations = extractSection(text, 'CITATIONS') || 'Supreme Court';
        const facts = extractSection(text, 'FACTS') || 'No facts provided.';
        const issue = extractSection(text, 'ISSUE') || 'Issue not specified.';
        const provisions = extractSection(text, 'PROVISIONS') || 'Labor Code of the Philippines';
        const verbatim = extractSection(text, 'VERBATIM_RULING') || 'Ruling not specified.';
        const ratio = extractSection(text, 'RATIO_DECIDENDI') || 'Ratio decidendi.';
        const fallo = extractSection(text, 'FALLO') || 'WHEREFORE, judgment rendered accordingly.';

        canvas.innerHTML = `
          <div class="digest-meta-tag">${item.topic} › ${item.subtopic}</div>
          <h2 class="digest-case-heading">${title}</h2>
          <div class="digest-citation">${citations}</div>

          <div class="digest-section">
            <div class="section-label facts-label">📋 RELEVANT FACTS (BAR EXAMINATION STYLE)</div>
            <div class="digest-text-content">${facts}</div>
          </div>

          <div class="digest-section">
            <div class="section-label issue-label">❓ ISSUE</div>
            <div class="digest-text-content"><strong>${issue}</strong></div>
          </div>

          <div class="digest-section">
            <div class="section-label rules-label">📖 PROVISIONS OF LAW AND RULES RELIED UPON</div>
            <div class="digest-text-content">${provisions}</div>
          </div>

          <div class="digest-section">
            <div class="section-label ruling-label">⚖ VERBATIM SUPREME COURT LEGAL BASIS</div>
            <div class="verbatim-box">${verbatim}</div>
          </div>

          <div class="digest-section">
            <div class="section-label ratio-label">🧠 RATIO DECIDENDI</div>
            <div class="digest-text-content" id="activeRatioText">${ratio}</div>
          </div>

          <div class="digest-section">
            <div class="section-label fallo-label">📜 FALLO (DISPOSITIVE PORTION)</div>
            <div class="fallo-box">${fallo}</div>
          </div>
        `;
      } catch (err) {
        canvas.innerHTML = `
          <div style="padding: 20px; color: #ef4444; font-size: 0.82rem;">
            <strong>Error loading case brief:</strong><br>
            <code>${err.message}</code>
          </div>
        `;
      }
    }
  }

  function selectCase(index) {
    selectedIndex = index;
    renderApp();
  }

  function copyRatio() {
    const txt = document.getElementById('activeRatioText')?.innerText;
    if (txt) {
      navigator.clipboard.writeText(txt).then(() => alert("Ratio Decidendi copied!"));
    }
  }
</script>
