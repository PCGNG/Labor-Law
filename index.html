  <style>
    :root {
      --bg-dark: #090e17;
      --bg-sidebar: #0d1420;
      --bg-middle: #101826;
      --bg-right: #131d2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
      --emerald-accent: #10b981;
      --sky-accent: #38bdf8;
      
      /* Infographic Pastel Tone Palette */
      --info-bg: #eceae3;
      --info-text: #1e293b;
      --info-card-facts: #e2ede5;
      --info-card-turning: #fde8e7;
      --info-card-issue: #fae0e4;
      --info-card-rationale: #f4ecdf;
      --info-card-doctrine: #daf0e4;
      --info-card-quote: #fdf5d6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP HEADER BAR */
    header.app-bar {
      height: 52px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
      z-index: 10;
    }

    .brand-block { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .badge-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
    }

    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .btn-secondary:hover { background: #334155; color: #fff; }
    .btn-primary { background: var(--gold-accent); color: #000; font-weight: 700; }
    .btn-primary:hover { background: #d97706; }
    .btn-emerald { background: #059669; color: #fff; }
    .btn-emerald:hover { background: #10b981; }

    /* 3-PANE WORKSPACE */
    .three-pane-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      width: 100vw;
    }
