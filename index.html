<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labor Law Reviewer | 3-Pane Syllabus View</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090e17;
      --bg-sidebar: #0d1420;
      --bg-middle: #101826;
      --bg-right: #131d2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
      --emerald-accent: #10b981;
      --sky-accent: #38bdf8;
      
      --info-bg: #eceae3;
      --info-text: #1e293b;
      --info-card-facts: #e2ede5;
      --info-card-turning: #fde8e7;
      --info-card-issue: #fae0e4;
      --info-card-rationale: #f4ecdf;
      --info-card-doctrine: #daf0e4;
      --info-card-quote: #fdf5d6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header.app-bar {
      height: 52px;
      background: #0b111a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand-block { display: flex; align-items: center; gap: 10px; }
    .brand-title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .badge-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
    }

    .btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .btn-secondary:hover { background: #334155; color: #fff; }
    .btn-primary { background: var(--gold-accent); color: #000; font-weight: 700; }
    .btn-primary:hover { background: #d97706; }

    .three-pane-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      width: 100vw;
    }

    .pane-header-strip {
      height: 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(13, 20, 32, 0.85);
      flex-shrink: 0;
    }

    /* PANE 1: LEFT */
    .pane-left-tree {
      width: 330px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tree-scroll-area { flex: 1; overflow-y: auto; padding: 12px 10px; }

    .topic-card {
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.015);
      border-radius: 8px;
      overflow: hidden;
    }

    .topic-title {
      padding: 8px 10px;
      background: rgba(30, 41, 59, 0.5);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtopic-item {
      padding: 7px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .subtopic-item:hover, .subtopic-item.active-subtopic {
      color: var(--sky-accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .case-sub-list {
      padding: 4px 6px 6px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-left: 2px solid #1e293b;
      margin: 4px 0 6px 14px;
    }

    .case-node {
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 0.7rem;
      line-height: 1.35;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: normal;
      word-break: break-word;
      display: block;
    }

    .case-node:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .case-node.active-case {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-accent);
      font-weight: 700;
      border-left: 2px solid var(--gold-accent);
    }

    /* PANE 2: MIDDLE */
    .pane-middle-overview {
      flex: 1;
      background: var(--bg-middle);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .middle-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .infographic-sheet {
      width: 100%;
      max-width: 580px;
      background-color: var(--info-bg);
      color: var(--info-text);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: fit-content;
    }

    .info-header {
      border-bottom: 2px solid #ded9cb;
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.15;
      color: #111827;
      text-transform: uppercase;
    }

    .info-badge-stamp { text-align: right; flex-shrink: 0; }
    .info-badge-stamp .tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #475569;
      display: block;
    }
    .info-badge-stamp .sub-tag { font-size: 0.62rem; font-weight: 700; color: #94a3b8; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-card {
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-card.card-facts { background-color: var(--info-card-facts); }
    .info-card.card-turning { background-color: var(--info-card-turning); }
    .info-card.card-issue { background-color: var(--info-card-issue); }
    .info-card.card-rationale { background-color: var(--info-card-rationale); }
    .info-card.card-doctrine { background-color: var(--info-card-doctrine); }
    .info-card.card-quote { background-color: var(--info-card-quote); }

    .info-card-title {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-card p { font-size: 0.74rem; line-height: 1.45; color: #1e293b; }

    /* PANE 3: RIGHT */
    .pane-right-digest {
      flex: 1.25;
      background: var(--bg-right);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .digest-scroll-area { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .digest-meta-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .digest-case-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 6px;
    }

    .digest-citation {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: #94a3b8;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .digest-section { margin-bottom: 20px; }
    .section-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label.facts-label { color: #fbbf24; }
    .section-label.issue-label { color: #38bdf8; }
    .section-label.held-label { color: #34d399; }
    .section-label.ratio-label { color: #f472b6; }
    .section-label.fallo-label { color: #f87171; }

    .digest-text-content {
      font-size: 0.85rem;
      line-height: 1.65;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .verbatim-box {
      font-style: italic;
      border-left: 3px solid #34d399;
      background: rgba(5, 150, 105, 0.08);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      color: #e2e8f0;
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .fallo-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      line-height: 1.5;
      color: #fca5a5;
      white-space: pre-wrap;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #263346; border-radius: 3px; }
  </style>
</head>
<body>

  <header class="app-bar">
    <div class="brand-block">
      <span class="brand-title">⚖ Labor Law Reviewer</span>
      <span class="badge-pill">3-Pane Syllabus View</span>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
    </div>
  </header>

  <main class="three-pane-container">
    <aside class="pane-left-tree">
      <div class="pane-header-strip">
        <span>📁 Syllabus Hierarchy</span>
        <span id="caseCountBadge" class="badge-pill">Loading...</span>
      </div>
      <div class="tree-scroll-area" id="syllabusTreeContainer"></div>
    </aside>

    <section class="pane-middle-overview">
      <div class="pane-header-strip">
        <span>● Topic & Sub-Topic Overview</span>
        <span id="middleTag" style="color: var(--gold-accent);">Doctrine Focus</span>
      </div>
      <div class="middle-scroll-area">
        <div class="infographic-sheet" id="overviewCanvas"></div>
      </div>
    </section>

    <section class="pane-right-digest">
      <div class="pane-header-strip">
        <span>⚖ Bar Exam Case Digest</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.65rem;" onclick="copyRatio()">Copy Ratio</button>
        </div>
      </div>
      <div class="digest-scroll-area" id="digestCanvas"></div>
    </section>
  </main>

  <script>
    let syllabusData = [];
    let selectedIndex = 9; // Defaults to Teologo v. People under sub-topic 'j'
    const fileCache = {};

    fetch('cases.json?t=' + Date.now())
      .then(res => {
        if (!res.ok) throw new Error("Could not find cases.json in repository.");
        return res.json();
      })
      .then(data => {
        syllabusData = data;
        renderApp();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('overviewCanvas').innerHTML = `
          <div style="padding: 20px; text-align: center; color: #ef4444;">
            <h3>Failed to load cases.json</h3>
            <p style="font-size: 0.8rem; margin-top: 6px; color: #94a3b8;">
              Please make sure <code>cases.json</code> is committed in your GitHub repository.
            </p>
          </div>
        `;
      });

    function renderApp() {
      renderLeftTree();
      renderMiddleOverview();
      renderRightDigest();
    }

    function renderLeftTree() {
      const tree = document.getElementById('syllabusTreeContainer');
      document.getElementById('caseCountBadge').textContent = `${syllabusData.length} Entries`;

      const structure = {};
      syllabusData.forEach((item, idx) => {
        if (!structure[item.topic]) structure[item.topic] = {};
        if (!structure[item.topic][item.subtopic]) structure[item.topic][item.subtopic] = [];
        structure[item.topic][item.subtopic].push({ entry: item, index: idx });
      });

      let html = '';
      for (const [topicName, subtopics] of Object.entries(structure)) {
        html += `
          <div class="topic-card">
            <div class="topic-title">
              <span>📁</span>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${topicName}</span>
            </div>
        `;

        for (const [subtopicName, entries] of Object.entries(subtopics)) {
          const isSubActive = entries.some(e => e.index === selectedIndex);
          const hasMultiple = entries.length > 1;

          html += `
            <div class="subtopic-item ${isSubActive ? 'active-subtopic' : ''}" onclick="selectCase(${entries[0].index})">
              <span>• ${subtopicName}</span>
              ${hasMultiple ? `<span style="font-size: 0.65rem; color: #64748b;">${entries.length} cases</span>` : ''}
            </div>
          `;

          if (hasMultiple) {
            html += `<div class="case-sub-list">`;
            entries.forEach(e => {
              const isCaseActive = e.index === selectedIndex;
              const displayName = e.entry.title || e.entry.id.replace(/-/g, ' ');
              html += `
                <div class="case-node ${isCaseActive ? 'active-case' : ''}" onclick="selectCase(${e.index})" title="${displayName}">
                  ⚖ ${displayName}
                </div>
              `;
            });
            html += `</div>`;
          }
        }
        html += `</div>`;
      }
      tree.innerHTML = html;
    }

    async function fetchTextFile(path) {
      if (!path) return '';
      if (fileCache[path]) return fileCache[path];
      
      const res = await fetch(encodeURI(path) + '?t=' + Date.now());
      if (!res.ok) throw new Error(`Could not load ${path} (Status: ${res.status})`);
      const text = await res.text();
      fileCache[path] = text;
      return text;
    }

    /* COMPREHENSIVE TEXT SECTION PARSER:
       Detects plain text headings with or without a colon:
       Facts:, Issue:, Held:, Ratio:, Fallo:
       as well as headings formatted with Markdown ### hashes.
    */
    function extractSectionText(rawText, headingName) {
      const regex = new RegExp(`^(?:#{1,4}\\s*)?${headingName}[:\\s]*\\n?([\\s\\S]*?)(?=(?:^(?:#{1,4}\\s*)?(?:Facts|Issue|Held|Ruling|Verbatim Legal Basis|Ratio|Ratio Decidendi|Fallo|Wherefore)[:\\s]*\\n?|$))`, 'im');
      const match = rawText.match(regex);
      return match ? match[1].trim() : '';
    }

    async function renderMiddleOverview() {
      const canvas = document.getElementById('overviewCanvas');
      if (syllabusData.length === 0) return;

      const item = syllabusData[selectedIndex];
      document.getElementById('middleTag').textContent = `${item.subtopic}`;

      if (item.overviewFile) {
        canvas.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">Loading overview from file...</div>';
        try {
          const text = await fetchTextFile(item.overviewFile);
          
          const title = extractSectionText(text, 'TITLE') || item.subtopic;
          const badge = extractSectionText(text, 'BADGE') || 'LABOR LAW';
          const legalBasis = extractSectionText(text, 'LEGAL_BASIS') || 'Labor Code of the Philippines';
          const facts = extractSectionText(text, 'FACTS') || 'Overview of statutory coverage and rules.';
          const turning = extractSectionText(text, 'TURNING_POINT') || 'Core operational dispute.';
          const issue = extractSectionText(text, 'ISSUE') || 'Core legal issue.';
          const rationale = extractSectionText(text, 'RATIONALE') || 'Supreme Court reasoning.';
          const doctrine = extractSectionText(text, 'DOCTRINE') || 'Controlling legal principle.';
          const takeaway = extractSectionText(text, 'TAKEAWAY') || 'Key memory aid.';

          canvas.innerHTML = `
            <div class="info-header">
              <div><h1 class="info-title">${title}</h1></div>
              <div class="info-badge-stamp">
                <span class="tag">${badge}</span>
                <span class="sub-tag">${legalBasis}</span>
              </div>
            </div>
            <div class="info-grid">
              <div class="info-card card-facts"><div class="info-card-title">📅 FACTS / SCOPE</div><p>${facts}</p></div>
              <div class="info-card card-rationale"><div class="info-card-title">⚖ RATIONALE</div><p>${rationale}</p></div>
            </div>
            <div class="info-grid">
              <div class="info-card card-turning"><div class="info-card-title">⚡ TURNING POINT</div><p>${turning}</p></div>
              <div class="info-card card-doctrine"><div class="info-card-title">🛡 DOCTRINE</div><p>${doctrine}</p></div>
            </div>
            <div class="info-grid">
              <div class="info-card card-issue"><div class="info-card-title">❓ CORE ISSUE</div><p><strong>${issue}</strong></p></div>
              <div class="info-card card-quote"><div class="info-card-title">💡 KEY TAKEAWAY</div><p style="font-weight: 700;">${takeaway}</p></div>
            </div>
          `;
        } catch (err) {
          canvas.innerHTML = `<div style="padding: 20px; color: #ef4444; font-size: 0.8rem;">Could not load overview: <code>${item.overviewFile}</code><br><span style="color:#64748b;">${err.message}</span></div>`;
        }
      }
    }

    async function renderRightDigest() {
      const canvas = document.getElementById('digestCanvas');
      if (syllabusData.length === 0) return;

      const item = syllabusData[selectedIndex];

      if (item.digestFile) {
        canvas.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">Loading case brief from file...</div>';
        try {
          const text = await fetchTextFile(item.digestFile);
          
          // Header detection from the first lines of the .txt
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          const firstLine = lines[0] && !lines[0].startsWith('#') ? lines[0] : (item.title || 'Case Brief');
          const secondLine = lines[1] && (lines[1].includes('G.R.') || lines[1].includes('Division') || lines[1].includes(',')) ? lines[1] : 'Supreme Court Jurisprudence';

          // Robust extraction supporting Facts, Issue, Held, Ratio, and Fallo
          const facts = extractSectionText(text, 'Facts') || 'No facts provided.';
          const issue = extractSectionText(text, 'Issue') || 'Issue not specified.';
          const held = extractSectionText(text, '(?:Held|Ruling|Verbatim Legal Basis)') || 'Ruling not specified.';
          const ratio = extractSectionText(text, '(?:Ratio|Ratio Decidendi)') || 'Ratio decidendi.';
          const fallo = extractSectionText(text, '(?:Fallo|Wherefore|Dispositive Portion)') || 'WHEREFORE, judgment rendered accordingly.';

          canvas.innerHTML = `
            <div class="digest-meta-tag">${item.topic} › ${item.subtopic}</div>
            <h2 class="digest-case-heading">${firstLine}</h2>
            <div class="digest-citation">${secondLine}</div>

            <div class="digest-section">
              <div class="section-label facts-label">📋 RELEVANT FACTS (BAR EXAMINATION STYLE)</div>
              <div class="digest-text-content">${facts}</div>
            </div>

            <div class="digest-section">
              <div class="section-label issue-label">❓ ISSUE</div>
              <div class="digest-text-content"><strong>${issue}</strong></div>
            </div>

            <div class="digest-section">
              <div class="section-label held-label">⚖ VERBATIM SUPREME COURT LEGAL BASIS / HELD</div>
              <div class="verbatim-box">${held}</div>
            </div>

            <div class="digest-section">
              <div class="section-label ratio-label">🧠 RATIO DECIDENDI</div>
              <div class="digest-text-content" id="activeRatioText">${ratio}</div>
            </div>

            <div class="digest-section">
              <div class="section-label fallo-label">📜 FALLO (DISPOSITIVE PORTION)</div>
              <div class="fallo-box">${fallo}</div>
            </div>
          `;
        } catch (err) {
          canvas.innerHTML = `<div style="padding: 20px; color: #ef4444; font-size: 0.8rem;">Could not load digest: <code>${item.digestFile}</code><br><span style="color:#64748b;">${err.message}</span></div>`;
        }
      }
    }

    function selectCase(index) {
      selectedIndex = index;
      renderApp();
    }

    function copyRatio() {
      const txt = document.getElementById('activeRatioText')?.innerText;
      if (txt) {
        navigator.clipboard.writeText(txt).then(() => alert("Ratio Decidendi copied!"));
      }
    }
  </script>
</body>
</html>
